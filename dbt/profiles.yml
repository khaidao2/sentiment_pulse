# How dbt connects to ClickHouse. Values come from env vars so the SAME file
# works locally (via `kubectl port-forward`) and inside the cluster (env from a
# k8s secret) — no password is ever committed here.
#
# Local dev:  export CLICKHOUSE_HOST=localhost  (after port-forwarding 8123)
# In-cluster: CLICKHOUSE_HOST=clickhouse.database.svc.cluster.local
sentpul:
  target: dev
  outputs:
    dev:
      type: clickhouse
      driver: http                       # ClickHouse HTTP interface (port 8123)
      secure: false                       # plain HTTP inside the cluster / port-forward
      host: "{{ env_var('CLICKHOUSE_HOST', 'localhost') }}"
      port: "{{ env_var('CLICKHOUSE_PORT', '8123') | int }}"
      user: "{{ env_var('CLICKHOUSE_USER', 'clickhouse') }}"
      password: "{{ env_var('CLICKHOUSE_PASSWORD', '') }}"
      schema: "{{ env_var('CLICKHOUSE_DB', 'default') }}"   # ClickHouse: schema == database
      connect_timeout: 15
      send_receive_timeout: 300
