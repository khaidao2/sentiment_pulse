<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 300" font-family="ui-sans-serif,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arw2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="1078" height="298" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="540" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Control plane — one contract generates DAG · manifest · DDL</text>

  <!-- contracts -->
  <rect x="28" y="104" width="200" height="92" rx="10" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="128" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#5b21b6">contracts/*.yaml</text>
  <text x="128" y="160" text-anchor="middle" font-size="11" fill="#5b21b6">producer + streaming</text>
  <text x="128" y="176" text-anchor="middle" font-size="11" fill="#5b21b6">single source of truth</text>

  <!-- sent-gen -->
  <rect x="288" y="120" width="150" height="60" rx="10" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="363" y="147" text-anchor="middle" font-size="14" font-weight="700" fill="#5b21b6">sent-gen</text>
  <text x="363" y="165" text-anchor="middle" font-size="11" fill="#5b21b6">render / register</text>

  <!-- outputs -->
  <rect x="498" y="70" width="272" height="46" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="634" y="98" text-anchor="middle" font-size="12" fill="#334155">dags/…_dag.py</text>
  <rect x="498" y="128" width="272" height="46" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="634" y="156" text-anchor="middle" font-size="12" fill="#334155">platform-gitops/manifests/*.yaml</text>
  <rect x="498" y="186" width="272" height="46" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="634" y="214" text-anchor="middle" font-size="12" fill="#334155">generated/sql/*.sql (DDL)</text>

  <!-- targets -->
  <rect x="828" y="70" width="224" height="46" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="940" y="98" text-anchor="middle" font-size="12" fill="#0f172a">Airflow → schedules crawler</text>
  <rect x="828" y="128" width="224" height="46" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="940" y="156" text-anchor="middle" font-size="12" fill="#0f172a">ArgoCD → deploys sink</text>
  <rect x="828" y="186" width="224" height="46" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="940" y="214" text-anchor="middle" font-size="12" fill="#0f172a">ClickHouse ← table</text>

  <!-- arrows contracts -> sent-gen -->
  <line x1="228" y1="150" x2="286" y2="150" stroke="#475569" stroke-width="2" marker-end="url(#arw2)"/>
  <!-- sent-gen -> outputs -->
  <line x1="438" y1="140" x2="496" y2="93" stroke="#475569" stroke-width="1.8" marker-end="url(#arw2)"/>
  <line x1="438" y1="150" x2="496" y2="151" stroke="#475569" stroke-width="1.8" marker-end="url(#arw2)"/>
  <line x1="438" y1="160" x2="496" y2="209" stroke="#475569" stroke-width="1.8" marker-end="url(#arw2)"/>
  <!-- outputs -> targets -->
  <line x1="770" y1="93" x2="826" y2="93" stroke="#475569" stroke-width="1.8" marker-end="url(#arw2)"/>
  <line x1="770" y1="151" x2="826" y2="151" stroke="#475569" stroke-width="1.8" marker-end="url(#arw2)"/>
  <line x1="770" y1="209" x2="826" y2="209" stroke="#475569" stroke-width="1.8" marker-end="url(#arw2)"/>

  <text x="540" y="272" text-anchor="middle" font-size="11" fill="#64748b">Edit the YAML, run sent-gen — the crawler image never parses YAML; config arrives as pod env vars.</text>
</svg>
