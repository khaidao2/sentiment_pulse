apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka-ui
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: 'https://github.com/khaidao2/sentiment_pulse'
    targetRevision: HEAD
    path: platform-gitops/manifests
    directory:
      # Glob, not one filename, so kafka-ui-oauth-sealed-secret.yaml is served
      # too. api_crawler/tests/test_dag_secrets.py fails on a SealedSecret
      # manifest that no Application syncs.
      include: 'kafka-ui*.yaml'
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: kafka
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
