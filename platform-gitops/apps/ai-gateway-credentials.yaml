# The lab's LLM gateway API key, for the course/career intelligence work.
#
# WHY SEALED AND NOT PULLED FROM VAULT. The key lives in OpenBao at
# secret/apps/ai-gateway/keys/anhhoang, which is the source of truth. The
# obvious GitOps answer would be External Secrets Operator reading it directly,
# but Vault's kubernetes auth mount is configured with
# `kubernetes_host: https://kubernetes.default.svc:443` -- it validates
# ServiceAccounts from the ba-ailab cluster it runs in, by calling TokenReview
# there. Vault sits on a public address (124.158.8.228) while this cluster's API
# server is tailnet-only (100.105.252.55:6443) on a SEPARATE tailnet, so Vault
# cannot reach us to validate our tokens. ESO would need a JWT auth mount with
# this cluster's SA signing public key pinned into Vault, which works but breaks
# opaquely if k3s ever rotates that key.
#
# Decision: the gateway key is not expected to rotate often, so SealedSecrets --
# already installed and proven here -- is less machinery for the same outcome.
# The cost is that Vault stops being the live source of truth for this value:
# rotating it there means re-running the kubeseal command and committing.
# Re-evaluate if this cluster ever needs more than a couple of lab secrets.
#
# WHAT IS SEALED: all seven fields of the Vault entry -- alias, api_key,
# endpoint, model, source, team, user. The intent was to seal only api_key and
# leave the non-secret endpoint/model as plain Deployment env, but the Vault
# path turned out to be a self-contained credential record carrying its own
# endpoint and model. Mirroring it whole is the better property: a key is issued
# FOR a gateway and a model, so keeping them together means the three cannot
# drift apart the way a sealed key plus a hardcoded endpoint would. The cost is
# that changing the model means re-running kubeseal, which is the same operation
# rotating the key already requires.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-gateway-credentials
  namespace: argocd
  annotations:
    # Same wave as the other credential apps: before anything that consumes it.
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/khaidao2/sentiment_pulse'
    targetRevision: HEAD
    path: platform-gitops/manifests
    directory:
      include: 'ai-gateway-sealed-credentials.yaml'
  destination:
    server: 'https://kubernetes.default.svc'
    # webapp: the MCP server and career-path agent will run alongside the
    # Postgres they query. A SealedSecret is namespace-scoped and sealed TO that
    # namespace, so serving it to airflow too means sealing a second copy.
    namespace: webapp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
