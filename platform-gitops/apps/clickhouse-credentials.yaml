apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: clickhouse-credentials
  namespace: argocd
  annotations:
    # Before airflow (wave 2): the task pods cannot be created without it.
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    # Deleting this Application must delete the SealedSecret with it, rather
    # than leaving it behind unmanaged (what happened with wepower-web).
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/khaidao2/sentiment_pulse'
    targetRevision: HEAD
    path: platform-gitops/manifests
    directory:
      include: 'clickhouse-sealed-credentials.yaml'
  destination:
    server: 'https://kubernetes.default.svc'
    # airflow, not database: the KPO task pods that consume it run here.
    namespace: airflow
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
