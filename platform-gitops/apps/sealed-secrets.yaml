apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    # Cài sớm để CRD SealedSecret + controller sẵn sàng trước các app dùng secret.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    # bitnami-labs.github.io/sealed-secrets was TAKEN DOWN -- the Pages site now
    # answers "Site not found" and its index.yaml 404s, so ArgoCD could not
    # render this app at all ("Failed to load target state"). The chart moved
    # with the repository to the bitnami org; this is the same chart, same
    # publisher, served from the new Pages site.
    #
    # The running controller was never affected, only Argo's ability to render
    # or resync it -- which is why the app read Healthy while its sync status
    # was Unknown.
    repoURL: 'https://bitnami.github.io/sealed-secrets'
    chart: sealed-secrets
    # HELD at 2.16.1 on purpose: its appVersion is 0.27.1, which is exactly the
    # controller image running in kube-system. Fixing a dead URL is not the
    # change to bundle a controller upgrade with -- the latest chart is 2.22.0,
    # and moving to it is its own commit with its own verification.
    targetRevision: 2.16.1
    helm:
      releaseName: sealed-secrets
      parameters:
        # Đặt tên controller khớp mặc định của kubeseal (sealed-secrets-controller / kube-system)
        - name: fullnameOverride
          value: sealed-secrets-controller
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
