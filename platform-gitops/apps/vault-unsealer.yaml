apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault-unsealer
  namespace: argocd
  annotations:
    # Wave 1, after the Vault server in wave 0. It tolerates an absent server
    # by design, so the ordering is about clarity rather than correctness.
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/khaidao2/sentiment_pulse'
    targetRevision: HEAD
    path: platform-gitops/manifests
    directory:
      # A glob, so the unseal keys this app's Deployment mounts are served by
      # the same Application that runs it. Matches vault-unsealer.yaml and
      # vault-unseal-keys-sealed-secret.yaml, and deliberately not
      # vault-cluster-secret-store.yaml, which another Application owns.
      include: 'vault-unseal*.yaml'
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: vault
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
