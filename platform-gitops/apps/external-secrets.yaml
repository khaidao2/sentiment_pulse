apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    # Wave 0, with Vault. It owns the CRDs that every ExternalSecret in later
    # waves is an instance of, so it cannot come after them.
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
    # charts.external-secrets.io answers 302 and the index is served from
    # external-secrets.io, with the chart tarballs on GitHub releases. Verified
    # end to end on 2026-11-11: the index redirect resolves to 200 and the
    # 2.15.0 tarball downloads. Worth stating because a chart URL that stopped
    # resolving is exactly what broke sealed-secrets rendering in PR #16.
    - repoURL: 'https://charts.external-secrets.io'
      chart: external-secrets
      targetRevision: 2.15.0
      helm:
        releaseName: external-secrets
        valueFiles:
          - $values/platform-gitops/helm-values/external-secrets-values.yaml
    - repoURL: 'https://github.com/khaidao2/sentiment_pulse'
      targetRevision: HEAD
      ref: values
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      # The CRDs are large enough to exceed the annotation size limit that
      # kubectl's client-side apply uses to store the last-applied config.
      - ServerSideApply=true
