apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault-cluster-secret-store
  namespace: argocd
  annotations:
    # Wave 1. The CRD it instantiates arrives with external-secrets in wave 0,
    # and the ExternalSecrets that reference it come later still.
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/khaidao2/sentiment_pulse'
    targetRevision: HEAD
    path: platform-gitops/manifests
    directory:
      include: 'vault-cluster-secret-store.yaml'
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
