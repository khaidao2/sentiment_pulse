apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlops-dev-platform
  namespace: argocd
  annotations:
    # Before credit-api-dev (wave 2), which needs its repository and secrets.
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/khaidao2/sentiment_pulse'
    targetRevision: HEAD
    path: platform-gitops/manifests
    directory:
      include: 'mlops-dev-*.yaml'
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: mlops-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
