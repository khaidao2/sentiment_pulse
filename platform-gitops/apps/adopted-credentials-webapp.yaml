apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: adopted-credentials-webapp
  namespace: argocd
  annotations:
    # Wave 1, with the other credentials, before the services that read them.
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/khaidao2/sentiment_pulse'
    targetRevision: HEAD
    path: platform-gitops/manifests
    directory:
      # The adopted- prefix exists so this glob cannot collide with the
      # hand-named sealed manifests that other Applications already own, such as
      # clickhouse-sealed-credentials.yaml or grafana-*-sealed-secret.yaml.
      include: 'adopted-webapp-*-sealed-secret.yaml'
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: webapp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
