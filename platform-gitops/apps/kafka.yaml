apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: 'https://charts.bitnami.com/bitnami'
    chart: kafka
    targetRevision: 23.0.7
    helm:
      parameters:
        - name: image.repository
          value: "bitnamilegacy/kafka"
        - name: replicaCount
          value: "1"
        - name: zookeeper.enabled
          value: "false"
        - name: kraft.enabled
          value: "true"
        - name: persistence.size
          value: "2Gi"
        # Heap is -Xmx1024m -Xms1024m by default; the limit must exceed it
        # (heap + off-heap/direct + page cache) or the JVM gets OOMKilled.
        - name: resources.limits.memory
          value: "2Gi"
        - name: resources.requests.memory
          value: "1Gi"
        - name: resources.requests.cpu
          value: "100m"
        - name: livenessProbe.enabled
          value: "false"
        - name: readinessProbe.enabled
          value: "false"
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: kafka
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
