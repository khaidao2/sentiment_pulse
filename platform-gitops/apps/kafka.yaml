apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: 'https://charts.bitnami.com/bitnami'
    chart: kafka
    targetRevision: 23.0.7
    helm:
      # No `provisioning:` block here on purpose. The chart does render
      # Job/kafka-provisioning from it, but that Job carries
      # `helm.sh/hook: post-install,post-upgrade` and ArgoCD v3.4.2 never
      # materializes it: no object, no events, and absent from every sync
      # result, through both a plain sync and a hard refresh. Declaring topics
      # here therefore looked correct in Git while creating nothing.
      # Topic existence is owned by the kafka-topic-reconcile CronJob instead
      # (platform-gitops/manifests/kafka-topic-reconcile.yaml), which depends
      # on no Helm hook. Do not re-add provisioning here -- two mechanisms
      # where one silently does nothing is worse than one that works.
      parameters:
        - name: image.repository
          value: "bitnamilegacy/kafka"
        - name: replicaCount
          value: "1"
        - name: zookeeper.enabled
          value: "false"
        - name: kraft.enabled
          value: "true"
        - name: persistence.size
          value: "2Gi"
        # Heap is -Xmx1024m -Xms1024m by default; the limit must exceed it
        # (heap + off-heap/direct + page cache) or the JVM gets OOMKilled.
        - name: resources.limits.memory
          value: "2Gi"
        - name: resources.requests.memory
          value: "1Gi"
        - name: resources.requests.cpu
          value: "100m"
        - name: livenessProbe.enabled
          value: "false"
        - name: readinessProbe.enabled
          value: "false"
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: kafka
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
