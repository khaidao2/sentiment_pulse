apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: 'https://charts.bitnami.com/bitnami'
    chart: kafka
    targetRevision: 23.0.7
    helm:
      # Topics are declared here, not left to broker auto-create. Every topic
      # below is the `kafka.topic` of a contract under data-contracts/contracts
      # (careerviet, courses, itviec, topcv). Auto-create only lands a topic
      # when a producer first publishes, so a weekly producer like courses
      # leaves its consumer crash-looping on UNKNOWN_TOPIC_OR_PART for up to a
      # week after any broker rebuild. The chart's provisioning Job is a Helm
      # post-install/post-upgrade hook (ArgoCD PostSync) and kafka-topics.sh
      # --if-not-exists, so re-running it is a no-op.
      # NOTE: sentiment-pulse.news and .community are owned by nlp-pipeline,
      # not by a contract here, so they stay auto-created.
      values: |
        provisioning:
          enabled: true
          numPartitions: 1
          replicationFactor: 1
          topics:
            - name: sentiment-pulse.careerviet
            - name: sentiment-pulse.courses
            - name: sentiment-pulse.itviec
            - name: sentiment-pulse.topcv
      parameters:
        - name: image.repository
          value: "bitnamilegacy/kafka"
        - name: replicaCount
          value: "1"
        - name: zookeeper.enabled
          value: "false"
        - name: kraft.enabled
          value: "true"
        - name: persistence.size
          value: "2Gi"
        # Heap is -Xmx1024m -Xms1024m by default; the limit must exceed it
        # (heap + off-heap/direct + page cache) or the JVM gets OOMKilled.
        - name: resources.limits.memory
          value: "2Gi"
        - name: resources.requests.memory
          value: "1Gi"
        - name: resources.requests.cpu
          value: "100m"
        - name: livenessProbe.enabled
          value: "false"
        - name: readinessProbe.enabled
          value: "false"
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: kafka
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
