# ArgoCD PostSync hook: register Avro schemas into Apicurio after the app syncs.
# Runs in-cluster (namespace kafka) so it can reach apicurio.kafka.svc.cluster.local.
apiVersion: batch/v1
kind: Job
metadata:
  name: sent-gen-register
  namespace: kafka
  annotations:
    argocd.argoproj.io/hook: PostSync
    # Keep the last run for log inspection; replaced on the next sync.
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  template:
    metadata:
      name: sent-gen-register
    spec:
      restartPolicy: Never
      containers:
        - name: register
          image: python:3.12-slim
          command: ["bash", "-lc"]
          args:
            - |
              set -e
              pip install -q pyyaml fastavro requests click jinja2
              git clone -q https://github.com/khaidao2/sentiment_pulse /app
              cd /app
              python -m sentpul.cli register
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
