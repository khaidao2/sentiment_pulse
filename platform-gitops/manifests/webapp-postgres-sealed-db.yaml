# SealedSecret -> Secret webapp-postgres-credentials in ns webapp.
# Safe to commit: encryptedData is sealed with the controller's public key and
# only the in-cluster sealed-secrets controller can decrypt it. Generated with:
#   kubectl create secret generic ... -n webapp --dry-run=client -o yaml | kubeseal --format yaml
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: webapp-postgres-credentials
  namespace: webapp
spec:
  encryptedData:
    POSTGRES_DB: 
    POSTGRES_PASSWORD: 
    POSTGRES_USER: 
  template:
    metadata:
      name: webapp-postgres-credentials
      namespace: webapp
