# Guardrails for the YTU Ops staging environment. Application code lives in
# khaidao2/ytu-ops.
#
# The environment starts closed: no traffic from other namespaces except
# Prometheus, and no egress to cluster services except DNS. Public routing and
# access to shared services are added explicitly with the workloads.
#
# Three volumes cover the Odoo database, Odoo filestore and search database.
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute-quota
  namespace: ytu-staging
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 3Gi
    limits.cpu: "4"
    limits.memory: 6Gi
    pods: "12"
    persistentvolumeclaims: "3"
    requests.storage: 30Gi
    services.loadbalancers: "0"
    services.nodeports: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: container-defaults
  namespace: ytu-staging
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: 500m
        memory: 512Mi
      max:
        cpu: "2"
        memory: 3Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: environment-isolation
  namespace: ytu-staging
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
  egress:
    - to:
        - podSelector: {}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: [10.42.0.0/16, 10.43.0.0/16]
