# How External Secrets Operator reaches Vault. One ClusterSecretStore, because
# credentials here are consumed from several namespaces and a per-namespace
# SecretStore would repeat the same Vault address and role in each one.
#
# THE SERVICE, NOT THE HEADLESS ONE. This points at `vault`, which drops a pod
# that fails its readiness probe. That is deliberate and the opposite of what
# the unsealer does. A sealed Vault should make ESO fail to connect, so the
# ExternalSecret reports NotReady and the already-written Secret keeps serving.
# Pointing ESO at vault-internal would let it talk to a sealed node and turn a
# clear connection error into a permission error that reads like a policy bug.
#
# No TLS, so no caBundle. Everything in this path is pod to pod inside one node.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-platform
spec:
  provider:
    vault:
      server: http://vault.vault.svc.cluster.local:8200
      # The kv-v2 mount that scripts/vault_bootstrap.sh enables. The eso-read
      # policy is scoped to platform/, so this store cannot read anything else
      # even if an ExternalSecret asks for it.
      path: platform
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
