# JWT_SECRET for sentiment-pulse-web, sealed for THIS cluster's controller
# (kube-system/sealed-secrets-controller). Safe to commit: only that controller's
# private key can decrypt it, and the SealedSecret is namespace+name scoped, so
# it will not decrypt if renamed or moved out of the webapp namespace.
#
# The value is a freshly generated `openssl rand -base64 48`. It is a signing key
# with no external meaning — nobody needs to know it, and rotating it only
# invalidates tokens already issued. To rotate:
#
#   kubectl -n webapp create secret generic sentiment-pulse-web-secrets \
#     --from-literal=JWT_SECRET="$(openssl rand -base64 48 | tr -d '\n')" \
#     --dry-run=client -o yaml | kubeseal --format yaml \
#     > platform-gitops/manifests/sentiment-pulse-web-sealed-secrets.yaml
#
# DATABASE_URL is deliberately NOT here — it is composed in
# sentiment-pulse-web.yaml from webapp-postgres-credentials so it cannot drift
# from the database's own credentials.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  creationTimestamp: null
  name: sentiment-pulse-web-secrets
  namespace: webapp
spec:
  encryptedData:
    JWT_SECRET: 
  template:
    metadata:
      creationTimestamp: null
      name: sentiment-pulse-web-secrets
      namespace: webapp
