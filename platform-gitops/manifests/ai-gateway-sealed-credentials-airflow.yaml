# AI_GATEWAY_* for the Airflow task pod that runs match_jobs_ai, sealed for
# this cluster's controller.
#
# WHY THIS FILE EXISTS, and it is the second time: reverse_etl_itviec's
# match_jobs_ai task reads `secretKeyRef: ai-gateway-credentials` for endpoint,
# api_key and model, but the only copy of that secret was sealed to the WEBAPP
# namespace. apps/ai-gateway-credentials.yaml says so in as many words -- "a
# SealedSecret is namespace-scoped and sealed TO that namespace, so serving it
# to airflow too means sealing a second copy" -- and the second copy was never
# made. The task therefore could not create its pod at all:
#   Error: secret "ai-gateway-credentials" not found
# and because `startup_timeout_seconds=600`, the KubernetesPodOperator waited
# out the full ten minutes before failing. It failed that way daily from
# 2026-11-04 and the duration is the tell: 07:34:12 -> 07:44:17 is the timeout,
# not the work.
#
# This is the same bug clickhouse-sealed-credentials.yaml was written for --
# a DAG moved to a secretKeyRef that nothing created. api_crawler's
# tests/test_dag_secrets.py now fails when a DAG references a secret no
# manifest seals into its namespace, so there is no third time.
#
# THREE KEYS, NOT SEVEN. The webapp copy mirrors the whole Vault record
# (alias/api_key/endpoint/model/source/team/user) because the web Deployment
# reads it whole. The DAG asks for exactly three and has no use for the rest,
# so only three are sealed here -- the smaller the copy, the less there is to
# keep in step when the key rotates.
#
# ROTATING means re-running, for BOTH namespaces:
#   kubectl -n webapp get secret ai-gateway-credentials -o jsonpath='{.data.endpoint}' | base64 -d
#   kubectl create secret generic ai-gateway-credentials --namespace=airflow \
#     --from-literal=endpoint=... --from-literal=api_key=... --from-literal=model=... \
#     --dry-run=client -o yaml \
#     | kubeseal --controller-namespace kube-system \
#         --controller-name sealed-secrets-controller --format yaml
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: ai-gateway-credentials
  namespace: airflow
spec:
  encryptedData:
    api_key: 
    endpoint: 
    model: 
  template:
    metadata:
      name: ai-gateway-credentials
      namespace: airflow
