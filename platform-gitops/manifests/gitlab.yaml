apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitlab-pvc
  namespace: database
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab
  namespace: database
  labels:
    app: gitlab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitlab
  template:
    metadata:
      labels:
        app: gitlab
    spec:
      containers:
        - name: gitlab
          image: gitlab/gitlab-ce:latest
          ports:
            - containerPort: 80
              name: http
            - containerPort: 22
              name: ssh
          env:
            - name: GITLAB_OMNIBUS_CONFIG
              value: |
                external_url 'https://gitlab.sentpul.click'
                # Optimize RAM for GitLab (under 3.5GB)
                puma['worker_processes'] = 2
                puma['min_threads'] = 1
                puma['max_threads'] = 2
                sidekiq['concurrency'] = 10
                postgresql['shared_buffers'] = '256MB'
                
                # Disable built-in monitoring to save RAM
                prometheus_monitoring['enable'] = false
                prometheus['enable'] = false
                alertmanager['enable'] = false
                node_exporter['enable'] = false
                redis_exporter['enable'] = false
                postgres_exporter['enable'] = false
                gitlab_exporter['enable'] = false
                
                # Expose metrics externally for K3s Prometheus
                gitlab_rails['monitoring_whitelist'] = ['0.0.0.0/0']
                puma['exporter_enabled'] = true
                puma['exporter_address'] = '0.0.0.0:8083'
                sidekiq['exporter_enabled'] = true
                sidekiq['exporter_address'] = '0.0.0.0:8082'
                gitaly['prometheus_listen_addr'] = '0.0.0.0:9236'
                
                # Keycloak SSO Integration
                gitlab_rails['omniauth_enabled'] = true
                gitlab_rails['omniauth_allow_single_sign_on'] = ['openid_connect']
                gitlab_rails['omniauth_block_auto_created_users'] = false
                gitlab_rails['omniauth_auto_link_saml_user'] = true
                gitlab_rails['omniauth_auto_link_openid_connect_user'] = true
                gitlab_rails['omniauth_providers'] = [
                  {
                    'name' => 'openid_connect',
                    'label' => 'Keycloak SSO',
                    'args' => {
                      'name' => 'openid_connect',
                      'scope' => ['openid', 'profile', 'email'],
                      'response_type' => 'code',
                      'issuer' => 'https://auth.sentpul.click/realms/data-platform',
                      'discovery' => true,
                      'client_auth_method' => 'query',
                      'client_options' => {
                        'identifier' => 'gitlab',
                        'secret' => 'gitlab-keycloak-secret-key-12345',
                        'redirect_uri' => 'https://gitlab.sentpul.click/users/auth/openid_connect/callback'
                      }
                    }
                  }
                ]
                
                # Connect to MinIO
                gitlab_rails['object_store']['enabled'] = true
                gitlab_rails['object_store']['connection'] = {
                  'provider' => 'AWS',
                  'region' => 'us-east-1',
                  'aws_access_key_id' => 'minioadmin',
                  'aws_secret_access_key' => 'minioadminpassword',
                  'endpoint' => 'https://minio.sentpul.click',
                  'path_style' => true
                }
                gitlab_rails['object_store']['objects']['artifacts']['bucket'] = 'gitlab-artifacts'
                gitlab_rails['object_store']['objects']['external_diffs']['bucket'] = 'gitlab-external-diffs'
                gitlab_rails['object_store']['objects']['lfs']['bucket'] = 'gitlab-lfs'
                gitlab_rails['object_store']['objects']['uploads']['bucket'] = 'gitlab-uploads'
                gitlab_rails['object_store']['objects']['packages']['bucket'] = 'gitlab-packages'
                gitlab_rails['object_store']['objects']['backups']['bucket'] = 'gitlab-backups'
                gitlab_rails['object_store']['objects']['dependency_proxy']['bucket'] = 'gitlab-dependency-proxy'
                gitlab_rails['object_store']['objects']['terraform_state']['bucket'] = 'gitlab-terraform-state'
                gitlab_rails['object_store']['objects']['pages']['bucket'] = 'gitlab-pages'
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          volumeMounts:
            - name: gitlab-storage
              mountPath: /var/opt/gitlab
              subPath: data
            - name: gitlab-storage
              mountPath: /var/log/gitlab
              subPath: logs
            - name: gitlab-storage
              mountPath: /etc/gitlab
              subPath: config
      volumes:
        - name: gitlab-storage
          persistentVolumeClaim:
            claimName: gitlab-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: gitlab
  namespace: database
spec:
  ports:
    - port: 80
      targetPort: 80
      name: http
    - port: 22
      targetPort: 22
      name: ssh
  selector:
    app: gitlab
