# SealedSecret -> Secret webapp-postgres-credentials (key `dsn`) in ns airflow,
# so the reverse_etl_itviec DAG's pod can mount the Postgres DSN. Same credentials
# as the webapp-ns secret, sealed for the airflow namespace.
#
# DSN is in libpq keyword form (not a URL) on purpose: the password contains an
# `@`, which breaks URL parsing (psycopg reads the host as `@webapp-postgres...`).
# Keyword form has no special chars to escape.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: webapp-postgres-credentials
  namespace: airflow
spec:
  encryptedData:
    dsn: 
  template:
    metadata:
      name: webapp-postgres-credentials
      namespace: airflow
