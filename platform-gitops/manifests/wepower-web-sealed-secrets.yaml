# SealedSecret -> Secret wepower-web-secrets in ns webapp (the WEPOWER HUB web app).
#
# Safe to commit: encryptedData is sealed with this cluster's sealed-secrets
# public key and only the in-cluster controller can decrypt it. Generated with:
#   kubectl create secret generic wepower-web-secrets -n webapp \
#     --from-literal=DATABASE_URL=... --from-literal=AUTH_SECRET=... \
#     --from-literal=EMAIL_WEBHOOK_SECRET=... \
#     --dry-run=client -o yaml | kubeseal --format yaml
#
# DATABASE_URL points at webapp-postgres with user `wepower`, whose search_path
# and grants confine it to the `wepower` schema — it has no rights on `public`,
# where the Sentiment Pulse app's tables live.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: wepower-web-secrets
  namespace: webapp
spec:
  encryptedData:
    AUTH_SECRET: 
    DATABASE_URL: 
    EMAIL_WEBHOOK_SECRET: 
  template:
    metadata:
      name: wepower-web-secrets
      namespace: webapp
