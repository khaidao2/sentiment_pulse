# YTU Ops staging workloads. Code and images come from khaidao2/ytu-ops; the
# namespace guardrails are in ytu-environments.yaml.
#
# Each image is pinned by tag AND digest. Promote by changing both in one PR;
# roll back by reverting that PR.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  namespace: ytu-staging
  labels:
    app.kubernetes.io/name: agent
    app.kubernetes.io/part-of: ytu-ops
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent
        app.kubernetes.io/part-of: ytu-ops
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      # Pinned to khaibaai: fedora pulls ghcr.io/khaidao2/* very slowly.
      nodeSelector:
        kubernetes.io/hostname: khaibaai
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: ghcr.io/khaidao2/ytu-ops-agent:sha-9a3091828ac1@sha256:e3e5f5252f5aacf9212a4879c462f79d4e1520b5ef9efc5e5d58771d1aac8e2b
          imagePullPolicy: IfNotPresent
          # The approval API (KAN-27). It reads X-Forwarded-User and -Groups only from the
          # loopback peer, i.e. the oauth2-proxy sidecar below; any other caller gets 401.
          env:
            - name: YTU_RUNTIME_DATABASE_URL
              valueFrom:
                secretKeyRef: {name: runtime-agent-credentials, key: url}
            - name: YTU_WORKSPACE_ID
              value: 57682531-329e-4d87-b627-3fa03ce2cef2
            - name: YTU_APPROVER_ROLES
              value: warehouse_lead,cs_lead,finance
            # Serves the notice outbox at /internal/notifications to the Discuss adapter.
            - name: YTU_NOTIFY_TOKEN
              valueFrom:
                secretKeyRef: {name: notify-service-token, key: token}
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
        # Signs people in through Keycloak (realm data-platform, client ytu-staging) and is the
        # only way in from outside the pod: it overwrites X-Forwarded-User and -Groups, which
        # the approval API trusts. Serves the web UI at / and the agent API at /api/.
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0@sha256:dcb6ff8dd21bf3058f6a22c6fa385fa5b897a9cd3914c88a2cc2bb0a85f8065d
          imagePullPolicy: IfNotPresent
          args:
            - --provider=keycloak-oidc
            - --oidc-issuer-url=https://auth.sentpul.click/realms/data-platform
            - --client-id=ytu-staging
            - --redirect-url=https://ytu-staging.sentpul.click/oauth2/callback
            - --http-address=0.0.0.0:4180
            - --reverse-proxy=true
            - --upstream=http://127.0.0.1:8080/api/
            - --upstream=http://web.ytu-staging.svc.cluster.local:80/
            - --email-domain=*
            - --user-id-claim=sub
            - --pass-user-headers=true
            - --cookie-name=_ytu_staging
            - --cookie-secure=true
            - --code-challenge-method=S256
            - --skip-provider-button=true
          env:
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: oauth2-proxy-ytu, key: client-secret}
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef: {name: oauth2-proxy-ytu, key: cookie-secret}
          ports:
            - containerPort: 4180
              name: gateway
          readinessProbe:
            httpGet: {path: /ping, port: gateway}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /ping, port: gateway}
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: agent
  namespace: ytu-staging
  labels:
    app.kubernetes.io/part-of: ytu-ops
spec:
  selector:
    app.kubernetes.io/name: agent
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Reminds once at half of each approval window and expires it at the end (KAN-27). The
# sweep logs one JSON line per event; nothing reaches approvers until the Discuss channel lands.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: approval-sweep
  namespace: ytu-staging
  labels:
    app.kubernetes.io/name: approval-sweep
    app.kubernetes.io/part-of: ytu-ops
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 240
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: approval-sweep
            app.kubernetes.io/part-of: ytu-ops
        spec:
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/hostname: khaibaai
          automountServiceAccountToken: false
          imagePullSecrets:
            - name: ghcr-pull
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: sweep
              image: ghcr.io/khaidao2/ytu-ops-agent:sha-9a3091828ac1@sha256:e3e5f5252f5aacf9212a4879c462f79d4e1520b5ef9efc5e5d58771d1aac8e2b
              imagePullPolicy: IfNotPresent
              command: ["python", "-m", "ytu_agent.approvals", "sweep"]
              env:
                - name: YTU_RUNTIME_DATABASE_URL
                  valueFrom:
                    secretKeyRef: {name: runtime-agent-credentials, key: url}
              resources:
                requests: {cpu: 10m, memory: 64Mi}
                limits: {cpu: 200m, memory: 128Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: discuss-adapter
  namespace: ytu-staging
  labels:
    app.kubernetes.io/name: discuss-adapter
    app.kubernetes.io/part-of: ytu-ops
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: discuss-adapter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: discuss-adapter
        app.kubernetes.io/part-of: ytu-ops
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      # Pinned to khaibaai: fedora pulls ghcr.io/khaidao2/* very slowly.
      nodeSelector:
        kubernetes.io/hostname: khaibaai
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: discuss-adapter
          image: ghcr.io/khaidao2/ytu-ops-discuss-adapter:sha-9a3091828ac1@sha256:f3620b3e3a75a6daa30d6dce10b75a49f7fb4641d7df2aecc4b029c81c3dc950
          imagePullPolicy: IfNotPresent
          # Presented to the agent's /internal/notifications routes (KAN-27).
          env:
            - name: YTU_NOTIFY_TOKEN
              valueFrom:
                secretKeyRef: {name: notify-service-token, key: token}
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: discuss-adapter
  namespace: ytu-staging
  labels:
    app.kubernetes.io/part-of: ytu-ops
spec:
  selector:
    app.kubernetes.io/name: discuss-adapter
  ports:
    - name: http
      port: 80
      targetPort: http
