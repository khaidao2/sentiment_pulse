# YTU Ops staging workloads. Code and images come from khaidao2/ytu-ops; the
# namespace guardrails are in ytu-environments.yaml.
#
# Each image is pinned by tag AND digest. Promote by changing both in one PR;
# roll back by reverting that PR.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  namespace: ytu-staging
  labels:
    app.kubernetes.io/name: agent
    app.kubernetes.io/part-of: ytu-ops
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent
        app.kubernetes.io/part-of: ytu-ops
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      # Pinned to khaibaai: fedora pulls ghcr.io/khaidao2/* very slowly.
      nodeSelector:
        kubernetes.io/hostname: khaibaai
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: ghcr.io/khaidao2/ytu-ops-agent:sha-55920f8c2167@sha256:c258abf33877567ac6e8ae4a559d5e2addb71faf2aa6b3d819e96a4756dd61b8
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
        # Signs people in through Keycloak (realm data-platform, client ytu-staging) and is the
        # only way in from outside the pod: it overwrites X-Forwarded-User and -Groups, which
        # the approval API trusts. Serves the web UI at / and the agent API at /api/.
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0@sha256:dcb6ff8dd21bf3058f6a22c6fa385fa5b897a9cd3914c88a2cc2bb0a85f8065d
          imagePullPolicy: IfNotPresent
          args:
            - --provider=keycloak-oidc
            - --oidc-issuer-url=https://auth.sentpul.click/realms/data-platform
            - --client-id=ytu-staging
            - --redirect-url=https://ytu-staging.sentpul.click/oauth2/callback
            - --http-address=0.0.0.0:4180
            - --reverse-proxy=true
            - --upstream=http://127.0.0.1:8080/api/
            - --upstream=http://web.ytu-staging.svc.cluster.local:80/
            - --email-domain=*
            - --user-id-claim=sub
            - --pass-user-headers=true
            - --cookie-name=_ytu_staging
            - --cookie-secure=true
            - --code-challenge-method=S256
            - --skip-provider-button=true
          env:
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: oauth2-proxy-ytu, key: client-secret}
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef: {name: oauth2-proxy-ytu, key: cookie-secret}
          ports:
            - containerPort: 4180
              name: gateway
          readinessProbe:
            httpGet: {path: /ping, port: gateway}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /ping, port: gateway}
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: agent
  namespace: ytu-staging
  labels:
    app.kubernetes.io/part-of: ytu-ops
spec:
  selector:
    app.kubernetes.io/name: agent
  ports:
    - name: http
      port: 80
      targetPort: http
