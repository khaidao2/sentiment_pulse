# YTU Ops staging workloads. Code and images come from khaidao2/ytu-ops; the
# namespace guardrails are in ytu-environments.yaml.
#
# Each image is pinned by tag AND digest. Promote by changing both in one PR;
# roll back by reverting that PR.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  namespace: ytu-staging
  labels:
    app.kubernetes.io/name: agent
    app.kubernetes.io/part-of: ytu-ops
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent
        app.kubernetes.io/part-of: ytu-ops
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      # Pinned to khaibaai: fedora pulls ghcr.io/khaidao2/* very slowly.
      nodeSelector:
        kubernetes.io/hostname: khaibaai
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 10001
      # KAN-12: /api/search loads multilingual-e5-small at start-up. The pinned weights are
      # fetched into an emptyDir on each pod start (no PVC: quota of 3, Odoo needs one).
      initContainers:
        - name: fetch-model
          image: ghcr.io/khaidao2/ytu-ops-agent:sha-bb2a1f1c0954@sha256:857542c15b7839f45c944d1203b8e4e0a9c3afc33c911099974f9ec30a0da31a
          imagePullPolicy: IfNotPresent
          command: ["ytu-index", "fetch-model", "--model-dir", "/models"]
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 250m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - {name: models, mountPath: /models}
      containers:
        - name: agent
          image: ghcr.io/khaidao2/ytu-ops-agent:sha-bb2a1f1c0954@sha256:857542c15b7839f45c944d1203b8e4e0a9c3afc33c911099974f9ec30a0da31a
          imagePullPolicy: IfNotPresent
          # The approval API (KAN-27). It reads X-Forwarded-User and -Groups only from the
          # loopback peer, i.e. the oauth2-proxy sidecar below; any other caller gets 401.
          env:
            - name: YTU_RUNTIME_DATABASE_URL
              valueFrom:
                secretKeyRef: {name: runtime-agent-credentials, key: url}
            - name: YTU_WORKSPACE_ID
              value: 57682531-329e-4d87-b627-3fa03ce2cef2
            - name: YTU_APPROVER_ROLES
              value: warehouse_lead,cs_lead,finance
            # Serves the notice outbox at /internal/notifications to the Discuss adapter.
            - name: YTU_NOTIFY_TOKEN
              valueFrom:
                secretKeyRef: {name: notify-service-token, key: token}
            # Odoo for the dispatcher (KAN-26, ytu-ops #42): the app builds it when the runtime
            # database and YTU_ODOO_URL are both set. All four must be set together.
            - name: YTU_ODOO_URL
              value: http://odoo.ytu-staging.svc.cluster.local:8069
            - name: YTU_ODOO_DATABASE
              value: ytu_odoo
            - name: YTU_ODOO_API_KEY
              valueFrom:
                secretKeyRef: {name: agent-odoo-credentials, key: api-key}
            # A service identity, not a person: uuid5(URL, ".../services/reconciliation").
            - name: YTU_RECONCILIATION_OWNER_ID
              value: cfcbf129-30e3-5f90-a481-d4c7697e3dcc
            # POST /api/search (KAN-12) over the corpus shipped in the image.
            - name: YTU_SEARCH_CORPUS_DIR
              value: /app/data/search/corpus-v2
            - name: YTU_E5_MODEL_DIR
              value: /models
            - name: YTU_SEARCH_OPERATOR_ROLES
              value: warehouse_lead,cs_lead,finance
            - name: YTU_SEARCH_LOG_KEY
              valueFrom:
                secretKeyRef: {name: search-log-key, key: log-key}
          ports:
            - containerPort: 8080
              name: http
          # The index is embedded at import; allow up to 5 minutes before liveness applies.
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests: {cpu: 50m, memory: 512Mi}
            limits: {cpu: 500m, memory: 1536Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: models
              mountPath: /models
              readOnly: true
        # Signs people in through Keycloak (realm data-platform, client ytu-staging) and is the
        # only way in from outside the pod: it overwrites X-Forwarded-User and -Groups, which
        # the approval API trusts. Serves the web UI at / and the agent API at /api/.
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0@sha256:dcb6ff8dd21bf3058f6a22c6fa385fa5b897a9cd3914c88a2cc2bb0a85f8065d
          imagePullPolicy: IfNotPresent
          args:
            - --provider=keycloak-oidc
            - --oidc-issuer-url=https://auth.sentpul.click/realms/data-platform
            - --client-id=ytu-staging
            - --redirect-url=https://ytu-staging.sentpul.click/oauth2/callback
            - --http-address=0.0.0.0:4180
            - --reverse-proxy=true
            - --upstream=http://127.0.0.1:8080/api/
            - --upstream=http://web.ytu-staging.svc.cluster.local:80/
            - --email-domain=*
            - --user-id-claim=sub
            - --pass-user-headers=true
            - --cookie-name=_ytu_staging
            - --cookie-secure=true
            - --code-challenge-method=S256
            - --skip-provider-button=true
          env:
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: oauth2-proxy-ytu, key: client-secret}
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef: {name: oauth2-proxy-ytu, key: cookie-secret}
          ports:
            - containerPort: 4180
              name: gateway
          readinessProbe:
            httpGet: {path: /ping, port: gateway}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /ping, port: gateway}
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: models
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: agent
  namespace: ytu-staging
  labels:
    app.kubernetes.io/part-of: ytu-ops
spec:
  selector:
    app.kubernetes.io/name: agent
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Reminds once at half of each approval window and expires it at the end (KAN-27). The
# sweep logs one JSON line per event; nothing reaches approvers until the Discuss channel lands.
# KAN-10 indexer. Suspended: run it by hand after a corpus change or a promotion that changes
# the index version, with
#   kubectl -n ytu-staging create job --from=cronjob/search-index search-index-$(date +%s)
# The init container fetches the pinned E5 files (470 MB, sha256 checked) into an emptyDir, so
# no PVC is spent on a model cache (ytu-staging allows 3). A sync with no changes embeds nothing.
# The image must contain `ytu-index` (ytu-ops #34 or later).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: search-index
  namespace: ytu-staging
  labels:
    app.kubernetes.io/name: search-index
    app.kubernetes.io/part-of: ytu-ops
spec:
  schedule: "0 3 * * *"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: search-index
            app.kubernetes.io/part-of: ytu-ops
        spec:
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/hostname: khaibaai
          automountServiceAccountToken: false
          imagePullSecrets:
            - name: ghcr-pull
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: fetch-model
              image: ghcr.io/khaidao2/ytu-ops-agent:sha-bb2a1f1c0954@sha256:857542c15b7839f45c944d1203b8e4e0a9c3afc33c911099974f9ec30a0da31a
              imagePullPolicy: IfNotPresent
              command: ["ytu-index", "fetch-model", "--model-dir", "/models"]
              resources:
                requests: {cpu: 50m, memory: 128Mi}
                limits: {cpu: 250m, memory: 256Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - {name: models, mountPath: /models}
          containers:
            - name: index
              image: ghcr.io/khaidao2/ytu-ops-agent:sha-bb2a1f1c0954@sha256:857542c15b7839f45c944d1203b8e4e0a9c3afc33c911099974f9ec30a0da31a
              imagePullPolicy: IfNotPresent
              command:
                - ytu-index
                - sync
                - --corpus
                - /app/data/search/corpus-v2
                - --workspace
                - 57682531-329e-4d87-b627-3fa03ce2cef2
              env:
                - name: YTU_E5_MODEL_DIR
                  value: /models
                - name: YTU_E5_THREADS
                  value: "2"
                - name: YTU_SEARCH_DATABASE_URL
                  valueFrom:
                    secretKeyRef: {name: search-postgres-credentials, key: owner-url}
              resources:
                requests: {cpu: 100m, memory: 512Mi}
                limits: {cpu: 750m, memory: 1536Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - {name: models, mountPath: /models, readOnly: true}
          volumes:
            - name: models
              emptyDir:
                sizeLimit: 1Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: approval-sweep
  namespace: ytu-staging
  labels:
    app.kubernetes.io/name: approval-sweep
    app.kubernetes.io/part-of: ytu-ops
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 240
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: approval-sweep
            app.kubernetes.io/part-of: ytu-ops
        spec:
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/hostname: khaibaai
          automountServiceAccountToken: false
          imagePullSecrets:
            - name: ghcr-pull
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: sweep
              image: ghcr.io/khaidao2/ytu-ops-agent:sha-bb2a1f1c0954@sha256:857542c15b7839f45c944d1203b8e4e0a9c3afc33c911099974f9ec30a0da31a
              imagePullPolicy: IfNotPresent
              command: ["python", "-m", "ytu_agent.approvals", "sweep"]
              env:
                - name: YTU_RUNTIME_DATABASE_URL
                  valueFrom:
                    secretKeyRef: {name: runtime-agent-credentials, key: url}
              resources:
                requests: {cpu: 10m, memory: 64Mi}
                limits: {cpu: 200m, memory: 128Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
---
