spec:
  selector:
    app.kubernetes.io/name: agent
  ports:
    - name: http
      port: 80
      targetPort: gateway

---
# The environment admits only same-namespace and monitoring traffic. The tunnel
# reaches the gateway port and nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-from-tunnel
  namespace: ytu-staging
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agent
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app: cloudflared
      ports:
        - {protocol: TCP, port: 4180}
