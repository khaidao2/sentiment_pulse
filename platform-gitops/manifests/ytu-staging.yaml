  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: discuss-adapter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: discuss-adapter
        app.kubernetes.io/part-of: ytu-ops
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      # Pinned to khaibaai: fedora pulls ghcr.io/khaidao2/* very slowly.
      nodeSelector:
        kubernetes.io/hostname: khaibaai
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: discuss-adapter
          image: ghcr.io/khaidao2/ytu-ops-discuss-adapter:sha-bb2a1f1c0954@sha256:02942b23e6ca74781703f3e77a46de927284ffa29cc8ae42693bbc48f44eab8a
          imagePullPolicy: IfNotPresent
          # Presented to the agent's /internal/notifications routes (KAN-27).
          env:
