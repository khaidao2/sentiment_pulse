# YTU Ops staging workloads. Code and images come from khaidao2/ytu-ops; the
# namespace guardrails are in ytu-environments.yaml.
#
# Each image is pinned by tag AND digest. Promote by changing both in one PR;
# roll back by reverting that PR.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  namespace: ytu-staging
  labels:
    app.kubernetes.io/name: agent
    app.kubernetes.io/part-of: ytu-ops
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent
        app.kubernetes.io/part-of: ytu-ops
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      # Pinned to khaibaai: fedora pulls ghcr.io/khaidao2/* very slowly.
      nodeSelector:
        kubernetes.io/hostname: khaibaai
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: ghcr.io/khaidao2/ytu-ops-agent:sha-c732ab167c16@sha256:09fc944b48d7277418b2453c430e58b0963c8e7288af39d7c454717bd9575f54
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: agent
  namespace: ytu-staging
  labels:
    app.kubernetes.io/part-of: ytu-ops
spec:
  selector:
    app.kubernetes.io/name: agent
  ports:
    - name: http
      port: 80
      targetPort: http
---
