# Generated by rotating the password on 2026-11-11.
#
# WHY IT WAS ROTATED. The mission-control-migrate Job ran an image built before
# migrate.py learned to redact the DSN, so it printed the full connection
# string, password included, to a log readable with `kubectl logs`. Re-pinning
# the image does not un-log it, so the credential itself had to change.
#
# ONE KEY, `dsn`. The application reads one value. The web app's migrate Job
# composes its URL from separate keys instead, so no full connection string is
# ever stored; that tradeoff is argued in mission-control-migrate.yaml.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: mission-control-postgres-credentials
  namespace: mission-control
spec:
  encryptedData:
    dsn: 
  template:
    metadata:
      name: mission-control-postgres-credentials
      namespace: mission-control
