# CLICKHOUSE_PASSWORD for the Airflow task pods (transform_itviec dbt_build and
# reverse_etl_itviec sync_jobs), sealed for this cluster's controller.
#
# Why this file exists: commit 67a26ec moved the password out of the DAGs and
# into `secretKeyRef: clickhouse-credentials/password`, but never added the
# secret. It did not exist in ANY namespace, so both DAGs failed every run with
#   Error: secret "clickhouse-credentials" not found
# (CreateContainerConfigError) — the task pod could not even be created.
#
# Namespace is airflow, not database: the KubernetesPodOperator pods run there,
# and a Secret is namespace-scoped. The `airflow` ArgoCD Application is a Helm
# chart source and cannot carry a loose manifest, which is why this has its own
# small Application (apps/clickhouse-credentials.yaml).
#
# KNOWN DRIFT: clickhouse.yaml:43 still sets the same password inline as
# `value: "clickhousepassword"`. Rotating means changing both. The right fix is
# for the ClickHouse Deployment to read this secret too — left alone here
# because it restarts the database.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  creationTimestamp: null
  name: clickhouse-credentials
  namespace: airflow
spec:
  encryptedData:
    password: 
  template:
    metadata:
      creationTimestamp: null
      name: clickhouse-credentials
      namespace: airflow
