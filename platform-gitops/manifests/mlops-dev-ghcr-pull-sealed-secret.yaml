# Read-only (read:packages) GHCR pull credential. The token expires on 2026-12-23.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: ghcr-pull
  namespace: mlops-dev
spec:
  encryptedData:
    .dockerconfigjson: 
  template:
    metadata:
      name: ghcr-pull
      namespace: mlops-dev
    type: kubernetes.io/dockerconfigjson
