# Re-sealed for KAN-35 from the original tunnel credential file, replacing an
# empty value. Ciphertext is safe to commit: only the in-cluster sealed-secrets
# controller holds the private key.
#
# managed: "true" is load bearing. It lets the controller adopt the existing Secret.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: cloudflared-creds
  namespace: kube-system
spec:
  encryptedData:
    credentials.json: 
  template:
    metadata:
      annotations:
        sealedsecrets.bitnami.com/managed: "true"
      name: cloudflared-creds
      namespace: kube-system
