# MLflow for the credit-mlops dev environment.
#
# SQLite and artifacts share one volume, so dev holds no platform credential.
# The shared MinIO has only a root identity, which dev must never receive. The
# server has no login: inside the cluster the namespace's network policy is its
# boundary, and the public hostname reaches it only through oauth2-proxy.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-data
  namespace: mlops-dev
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: mlops-dev
  labels:
    app: mlflow
spec:
  replicas: 1
  # SQLite and a ReadWriteOnce volume allow only one writer.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v3.18.0@sha256:257204c77980b0f3450a26eb6089e487603fcdd4509529eadaf88f90669f5c13
          command:
            - mlflow
            - server
            - --host=0.0.0.0
            - --port=5000
            - --workers=1
            - --backend-store-uri=sqlite:////mlflow/mlflow.db
            - --artifacts-destination=/mlflow/artifacts
            - --serve-artifacts
            - --allowed-hosts=mlflow.mlops-dev.svc.cluster.local:5000,mlflow.mlops-dev.svc:5000,mlflow:5000,localhost:5000,mlflow-dev.sentpul.click
            - --cors-allowed-origins=https://mlflow-dev.sentpul.click
          env:
            - name: HOME
              value: /tmp
            # The job runner raises idle memory from about 440 MiB to 1.9 GiB.
            - name: MLFLOW_SERVER_ENABLE_JOB_EXECUTION
              value: "false"
          ports:
            - name: http
              containerPort: 5000
          startupProbe:
            httpGet: &health
              path: /health
              port: http
              httpHeaders:
                - name: Host
                  value: localhost:5000
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: *health
            periodSeconds: 10
          livenessProbe:
            httpGet: *health
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /mlflow
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mlflow-data
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: mlops-dev
spec:
  selector:
    app: mlflow
  ports:
    - name: http
      port: 5000
      targetPort: http
---
# The only path in from the public tunnel, and only to the login proxy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cloudflared-to-oauth2-proxy
  namespace: mlops-dev
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: oauth2-proxy
      app.kubernetes.io/instance: oauth2-proxy-mlflow-dev
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app: cloudflared
      ports:
        - protocol: TCP
          port: 4180
