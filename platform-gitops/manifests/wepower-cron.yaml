---
# Google Sheet sync. Every five minutes is enough: the finest cadence a tenant
# can pick is hourly, and `isSyncDue` — not this schedule — decides whether a
# given connection actually runs.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: wepower-google-sheet-sync
  labels: { app: wepower-cron }
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: cron
              image: ghcr.io/khaidao2/wepowerhub-web:latest
              command: ["node"]
              args:
                - "-e"
                - "(async()=>{const{APP_URL,CRON_SECRET}=process.env;const u=APP_URL.replace(/\\/$/,'')+'/api/cron/google-sheet-sync';const r=await fetch(u,{method:'POST',headers:{'x-cron-secret':CRON_SECRET}});const b=await r.text();console.log('[cron-google-sheet-sync]',r.status,b);if(!r.ok)process.exit(1);})().catch(e=>{console.error(e);process.exit(1);});"
              env:
                - name: APP_URL
                  value: "https://wepower.sentpul.click"
                - name: CRON_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: wepower-web-secrets
                      key: CRON_SECRET
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { cpu: 200m, memory: 256Mi }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
