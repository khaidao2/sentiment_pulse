apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  namespace: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-ui
  template:
    metadata:
      labels:
        app: kafka-ui
    spec:
      containers:
        - name: kafka-ui
          image: provectuslabs/kafka-ui:v0.7.2
          ports:
            - containerPort: 8080
          env:
            - name: KAFKA_CLUSTERS_0_NAME
              value: local
            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: kafka.kafka.svc.cluster.local:9092
            # Native OIDC SSO via Keycloak (same pattern as MinIO — no
            # oauth2-proxy needed). Client created by scripts/kafka_ui_keycloak.sh.
            #
            # v0.7.x uses its own AUTH_OAUTH2_CLIENT_<name>_* env vars, NOT the
            # standard SPRING_SECURITY_OAUTH2_CLIENT_* ones (those are silently
            # ignored -> "OAuth2 authentication is enabled but no providers
            # specified" crash on boot).
            - name: AUTH_TYPE
              value: OAUTH2
            - name: AUTH_OAUTH2_CLIENT_KEYCLOAK_CLIENT_ID
              value: kafka-ui
            - name: AUTH_OAUTH2_CLIENT_KEYCLOAK_CLIENT_SECRET
              value: "736d99c12362911eeb9837cc08dcc7d83fa2af3c20485851"
            - name: AUTH_OAUTH2_CLIENT_KEYCLOAK_SCOPE
              value: openid,profile,email
            # Hardcoded — kafka-ui computes this dynamically from the
            # incoming request scheme by default, which becomes "http://"
            # when Cloudflare forwards a plain-HTTP request, mismatching the
            # "https://" URI registered in Keycloak ("Invalid parameter:
            # redirect_uri"). Same fix pattern as CloudBeaver/MinIO.
            - name: AUTH_OAUTH2_CLIENT_KEYCLOAK_REDIRECT_URI
              value: "https://kafka.sentpul.click/login/oauth2/code/keycloak"
            - name: AUTH_OAUTH2_CLIENT_KEYCLOAK_ISSUER_URI
              value: "https://auth.sentpul.click/realms/data-platform"
            - name: AUTH_OAUTH2_CLIENT_KEYCLOAK_USER_NAME_ATTRIBUTE
              value: preferred_username
            - name: AUTH_OAUTH2_CLIENT_KEYCLOAK_CLIENT_NAME
              value: keycloak
            - name: AUTH_OAUTH2_CLIENT_KEYCLOAK_PROVIDER
              value: keycloak
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
  namespace: kafka
spec:
  ports:
    - port: 80
      targetPort: 8080
  selector:
    app: kafka-ui
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kafka-ui-ingress
  namespace: kafka
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  ingressClassName: traefik
  rules:
    - host: kafka-ui.sentpul.click
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kafka-ui
                port:
                  number: 80
