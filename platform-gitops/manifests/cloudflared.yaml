apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: kube-system
data:
  config.yaml: |
    tunnel: c3fe5ab2-42d6-466c-9b0e-17ff88b14de6
    credentials-file: /etc/cloudflared/creds/credentials.json
    ingress:
      - hostname: airflow.sentpul.click
        service: http://airflow-api-server.airflow:8080
      - hostname: argocd.sentpul.click
        service: http://argocd-server.argocd:80
      - hostname: kafka.sentpul.click
        service: http://kafka-ui.kafka:80
      - hostname: auth.sentpul.click
        service: http://keycloak.keycloak:80
      - hostname: grafana.sentpul.click
        service: http://grafana.airflow:80
      - hostname: minio.sentpul.click
        service: http://minio.database:9001
      - hostname: minio-api.sentpul.click
        service: http://minio.database:9000
      - hostname: cloudbeaver.sentpul.click
        service: http://oauth2-proxy-cloudbeaver.database:80
      # Sentiment Pulse web app. Hostname reused from the removed WEPOWER HUB so
      # no new Cloudflare DNS record is needed. ClusterIP, not NodePort: the
      # cross-node pod networking that forced NodePort before was fixed
      # 2026-10-29 (firewalld forward reject + stale flannel VXLAN peers).
      - hostname: wepower.sentpul.click
        service: http://sentiment-pulse-web.webapp:80
      # Mission Control, the agent operations platform. Routed to its
      # oauth2-proxy and NOT to the application, the same as cloudbeaver above.
      # The app has its own Keycloak client but does not enforce it yet: its API
      # answers /api/workspaces with 200 and no credentials, verified against a
      # running container. A direct route here would publish the agent fleet's
      # data to the internet.
      #
      # This hostname needs a Cloudflare DNS record, unlike wepower.sentpul.click
      # which reused one. Until the record and the Deployment both exist, this
      # rule resolves to nothing rather than to something unprotected.
      - hostname: mission-control.sentpul.click
        service: http://oauth2-proxy-mission-control.mission-control:80
      - service: http_status:404
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: kube-system
  labels:
    app: cloudflared
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
      - name: cloudflared
        image: cloudflare/cloudflared:latest
        args:
        - tunnel
        - --config
        - /etc/cloudflared/config/config.yaml
        - run
        volumeMounts:
        - name: config
          mountPath: /etc/cloudflared/config
          readOnly: true
        - name: creds
          mountPath: /etc/cloudflared/creds
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: cloudflared-config
      - name: creds
        secret:
          secretName: cloudflared-creds
