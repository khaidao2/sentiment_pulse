apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cloudbeaver-pvc
  namespace: database
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudbeaver
  namespace: database
  labels:
    app: cloudbeaver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudbeaver
  template:
    metadata:
      labels:
        app: cloudbeaver
    spec:
      containers:
        - name: cloudbeaver
          # Pin to a fixed tag in production instead of latest.
          image: dbeaver/cloudbeaver:latest
          ports:
            - containerPort: 8978
              name: http
          env:
            # All four CB_* below are required for unattended setup (no wizard).
            # The workspace PVC must be empty on first boot for this to apply;
            # if the wizard already ran, wipe workspace/.data and restart.
            - name: CB_SERVER_NAME
              value: "Sentiment Pulse CloudBeaver"
            # Public URL so CloudBeaver builds correct links behind the proxy.
            - name: CB_SERVER_URL
              value: "https://cloudbeaver.sentpul.click"
            - name: CB_ADMIN_NAME
              value: "cbadmin"
            # Must satisfy CloudBeaver's password policy (upper+lower+digit).
            - name: CB_ADMIN_PASSWORD
              value: "CbAdmin2026!"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            - name: workspace
              mountPath: /opt/cloudbeaver/workspace
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: cloudbeaver-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: cloudbeaver
  namespace: database
spec:
  ports:
    - port: 8978
      targetPort: 8978
      name: http
  selector:
    app: cloudbeaver
