# KEYCLOAK_CLIENT_SECRET for sentiment-pulse-web, sealed for THIS cluster's
# controller (kube-system/sealed-secrets-controller). The plaintext was
# generated by Keycloak for the confidential client `skillbridge-web` in realm
# `data-platform`; it was never printed, committed, or written to disk outside
# the sealing pipeline.
#
# To rotate: regenerate the client secret in Keycloak, then re-seal only this
# value with kubeseal. Rotating it invalidates in-flight OAuth exchanges only.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: sentiment-pulse-keycloak-oauth
  namespace: webapp
spec:
  encryptedData:
    KEYCLOAK_CLIENT_SECRET: 
  template:
    metadata:
      name: sentiment-pulse-keycloak-oauth
      namespace: webapp
