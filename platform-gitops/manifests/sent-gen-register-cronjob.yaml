# Periodically register Avro schemas into Apicurio. Runs in-cluster
# (namespace kafka) to reach apicurio.kafka.svc.cluster.local.
# `sent-gen register` is idempotent (OVERWRITE), so re-running is safe.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sent-gen-register
  namespace: kafka
spec:
  schedule: "0 */6 * * *"          # every 6 hours
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: register
              image: python:3.12-slim
              command: ["bash", "-lc"]
              args:
                - |
                  set -e
                  pip install -q pyyaml fastavro requests click jinja2
                  git clone -q https://github.com/khaidao2/sentiment_pulse /app
                  cd /app
                  python -m sentpul.cli register
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
