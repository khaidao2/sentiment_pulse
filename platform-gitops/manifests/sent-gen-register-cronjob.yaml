# Periodically register Avro schemas into Apicurio. Runs in-cluster
# (namespace kafka) to reach apicurio.kafka.svc.cluster.local.
# `sent-gen register` is idempotent (OVERWRITE), so re-running is safe.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sent-gen-register
  namespace: kafka
spec:
  schedule: "0 */6 * * *"          # every 6 hours
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: register
              image: python:3.12-slim
              command: ["bash", "-lc"]
              args:
                - |
                  set -e
                  apt-get update -qq && apt-get install -y -qq --no-install-recommends git
                  git clone -q https://github.com/khaidao2/sentiment_pulse /app
                  # Install the package itself, which also pulls its declared
                  # deps -- listing them by hand here let them drift from
                  # data-contracts/pyproject.toml. It MUST be editable: sentpul
                  # config.py derives CONTRACTS_DIR from __file__, so a copy in
                  # site-packages would look for contracts/ beside itself and
                  # find nothing. `sent-gen` is the console_script entry point.
                  pip install -q -e /app/data-contracts
                  sent-gen register
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
