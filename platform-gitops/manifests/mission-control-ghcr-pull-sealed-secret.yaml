# Generated by sealing the operator's ghcr pull token on 2026-11-11.
# Named mission-control-* so the mission-control Application's existing include
# glob serves it, which is the guard api_crawler's test_dag_secrets.py enforces.
#
# SCOPE RISK, ACCEPTED KNOWINGLY. The token behind this carries `repo` and
# `write:packages`, not `read:packages`. Anyone who can read Secrets in this
# namespace, or any pod using that service account, inherits full private-repo
# write and the ability to overwrite images in ghcr.io/khaidao2/*. Kubernetes
# Secrets are base64, not encrypted, so RBAC is the only thing holding that
# back. Rotating to a read:packages-only token is a two-command change.
#
# Verified before committing: ghcr.io issued a pull token for
# repository:khaidao2/mission-control:pull using this credential.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: ghcr-pull
  namespace: mission-control
spec:
  encryptedData:
    .dockerconfigjson: 
  template:
    metadata:
      annotations:
        sealedsecrets.bitnami.com/managed: "true"
      name: ghcr-pull
      namespace: mission-control
    type: kubernetes.io/dockerconfigjson
