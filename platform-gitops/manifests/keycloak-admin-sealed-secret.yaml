# The Keycloak master-realm admin password, encrypted to this cluster's
# sealed-secrets key.
#
# WHY THIS EXISTS. The password used to sit in plaintext in
# helm-values/keycloak-values.yaml as a literal `auth.adminPassword`, in a
# PUBLIC repository, from 2026-05-21. Keycloak at auth.sentpul.click is the
# identity provider in front of Airflow, ArgoCD, Grafana, MinIO, CloudBeaver
# and kafka-ui, and both oauth2-proxies admit any authenticated user
# (email_domains: ["*"]), so that one line was effectively a public key to the
# whole platform. It has been rotated; the old value is dead and must stay
# treated as compromised, because it remains readable in git history.
#
# ENCRYPTED, NOT HIDDEN. SealedSecret ciphertext is safe to commit: only the
# in-cluster controller holds the private key. This is the same pattern already
# used by clickhouse-sealed-credentials.yaml and webapp-postgres-sealed-dsn.yaml
# -- the Helm values files are simply where that migration had not reached.
#
# SCOPE IS STRICT (the default): this ciphertext only decrypts as the secret
# named `keycloak-admin` in namespace `keycloak`. Renaming either side silently
# produces nothing, which is why the name is pinned by auth.existingSecret in
# keycloak-values.yaml rather than left to the release name.
#
# ROTATING AGAIN: change it in Keycloak first (the admin user lives in the
# Keycloak database, so the Helm value only ever seeded it and changing this
# file alone does NOT change the live password), then re-seal:
#   printf %s '<new>' > pw && kubectl create secret generic keycloak-admin \
#     -n keycloak --from-file=admin-password=pw --dry-run=client -o yaml \
#     | kubeseal --format yaml > platform-gitops/manifests/keycloak-admin-sealed-secret.yaml
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: keycloak-admin
  namespace: keycloak
spec:
  encryptedData:
    admin-password: 
  template:
    metadata:
      name: keycloak-admin
      namespace: keycloak
