# Lets Airflow task workers run credit pipeline pods in mlops-dev only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: airflow-credit-pipeline
  namespace: mlops-dev
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, get, list, watch, patch, delete]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [events]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: airflow-credit-pipeline
  namespace: mlops-dev
subjects:
  - kind: ServiceAccount
    name: airflow-worker
    namespace: airflow
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: airflow-credit-pipeline
