# GOOGLE_CLIENT_SECRET for sentiment-pulse-web, sealed for THIS cluster's
# controller (kube-system/sealed-secrets-controller). Safe to commit: only that
# controller's private key can decrypt it, and it is namespace+name scoped.
#
# This is the WEB client secret from Google Cloud project `social-for`. It is
# NOT mounted by the web app any more: Google is an identity provider inside
# Keycloak. Keep it as the source for (re)configuring that IdP, and rotate it
# here and in Keycloak together.
#
#   kubectl create secret generic sentiment-pulse-google-oauth -n webapp \
#     --from-literal=GOOGLE_CLIENT_SECRET="<new secret>" \
#     --dry-run=client -o yaml | kubeseal --format yaml \
#     > platform-gitops/manifests/sentiment-pulse-google-oauth.yaml
#
# NEVER put the plaintext value in this file or in a commit message.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: sentiment-pulse-google-oauth
  namespace: webapp
  annotations:
    # Applied before the Deployment (wave 1) so the pod never has to wait for
    # the controller to create the Secret it mounts as an env var.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  encryptedData:
    GOOGLE_CLIENT_SECRET: 
  template:
    metadata:
      name: sentiment-pulse-google-oauth
      namespace: webapp
