# Grafana admin credential, encrypted to this cluster's sealed-secrets key.
#
# THIS ONLY SEEDS A FRESH GRAFANA. Grafana keeps the admin password in its
# own database and ignores GF_SECURITY_ADMIN_PASSWORD after first boot, so
# editing this file does NOT change a running Grafana -- resealing alone
# once left a publicly leaked password live. Use
# scripts/rotate_grafana_admin.sh, which resets it inside the pod.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: grafana-admin-sealed
  namespace: airflow
spec:
  encryptedData:
    admin-password: 
    admin-user: 
  template:
    metadata:
      name: grafana-admin-sealed
      namespace: airflow
