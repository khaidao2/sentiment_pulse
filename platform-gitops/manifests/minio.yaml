apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-pvc
  namespace: database
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: database
  labels:
    app: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          command:
            - minio
            - server
            - /data
            - --console-address
            - :9001
          ports:
            - containerPort: 9000
              name: api
            - containerPort: 9001
              name: console
          env:
            - name: MINIO_ROOT_USER
              value: "minioadmin"
            - name: MINIO_ROOT_PASSWORD
              value: "minioadminpassword"
            - name: MINIO_IDENTITY_OPENID_CONFIG_URL
              value: "http://keycloak.keycloak:80/realms/data-platform/.well-known/openid-configuration"
            - name: MINIO_IDENTITY_OPENID_CLIENT_ID
              value: "minio"
            - name: MINIO_IDENTITY_OPENID_CLIENT_SECRET
              value: "minio-keycloak-client-secret-key-1234"
            - name: MINIO_IDENTITY_OPENID_REDIRECT_URI
              value: "https://minio.sentpul.click/oauth_callback"
            - name: MINIO_IDENTITY_OPENID_SCOPES
              value: "openid,profile,email"
            - name: MINIO_IDENTITY_OPENID_CLAIM_NAME
              value: "policy"
            - name: MINIO_IDENTITY_OPENID_DISPLAY_NAME
              value: "Keycloak SSO"
            - name: MINIO_BROWSER_REDIRECT_URL
              value: "https://minio.sentpul.click"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: minio-storage
              mountPath: /data
      volumes:
        - name: minio-storage
          persistentVolumeClaim:
            claimName: minio-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: database
spec:
  ports:
    - port: 9000
      targetPort: 9000
      name: api
    - port: 9001
      targetPort: 9001
      name: console
  selector:
    app: minio
