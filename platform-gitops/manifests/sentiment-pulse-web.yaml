# Sentiment Pulse web app — FastAPI API + the built frontend in one image.
#
# Credentials are NOT here. Two sources:
#   * webapp-postgres-credentials (existing SealedSecret) gives POSTGRES_USER /
#     POSTGRES_PASSWORD / POSTGRES_DB; DATABASE_URL is composed from them below
#     with $(VAR) interpolation, so the DSN is never duplicated in a second
#     secret that could drift from the database's own.
#   * sentiment-pulse-web-secrets (SealedSecret you generate with kubeseal, see
#     the header of sentiment-pulse-web-sealed-secrets.yaml) gives JWT_SECRET.
#   * sentiment-pulse-keycloak-oauth (SealedSecret) gives the Keycloak client
#     secret. Google is an identity provider INSIDE Keycloak, so its client
#     secret is not an env var here.
#
# The image is PRIVATE on ghcr.io, unlike sentiment-pulse-crawler which is
# public and therefore needs no pull secret. Hence imagePullSecrets: ghcr-pull.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentiment-pulse-web
  namespace: webapp
  labels:
    app: sentiment-pulse-web
  annotations:
    # Wave 1, AFTER the migration Job at wave 0. ArgoCD waits for a wave to go
    # healthy before starting the next, so a failed migration leaves this
    # Deployment unsynced and the running replicas untouched -- old code keeps
    # serving the old schema rather than new code meeting tables that are not
    # there yet. See sentiment-pulse-web-migrate.yaml for why a wave is used
    # instead of a PreSync hook.
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sentiment-pulse-web
  template:
    metadata:
      labels:
        app: sentiment-pulse-web
    spec:
      # No nodeSelector on purpose. wepower-web had to be pinned (and cloudflared
      # reached it by NodePort) because pod traffic between the two nodes did not
      # flow; that was firewalld rejecting forward plus stale flannel VXLAN peers,
      # both fixed 2026-10-29. ClusterIP works from either node now.
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: web
          image: ghcr.io/khaidao2/sentiment-pulse-web:sha-808b01d
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - secretRef:
                name: webapp-postgres-credentials
          env:
            # Composed, not stored: $(VAR) refers to the envFrom keys above.
            - name: DATABASE_URL
              value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@webapp-postgres.webapp.svc.cluster.local:5432/$(POSTGRES_DB)
            # The AI sandbox's decision point. No default: OpaPolicy raises
            # when this is unset, so a misconfigured deploy refuses model
            # calls rather than making them unpoliced.
            - name: OPA_URL
              value: http://127.0.0.1:8181
            # The LLM gateway. envFrom would import alias/team/user/source too,
            # which the app has no use for, so the three it needs are named.
            - name: AI_GATEWAY_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: ai-gateway-credentials
                  key: endpoint
            - name: AI_GATEWAY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-gateway-credentials
                  key: api_key
            - name: AI_GATEWAY_MODEL
              valueFrom:
                secretKeyRef:
                  name: ai-gateway-credentials
                  key: model
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sentiment-pulse-web-secrets
                  key: JWT_SECRET
            # Keycloak brokers Google. The app adds kc_idp_hint=google to the
            # authorization request, so Keycloak forwards straight to Google
            # instead of rendering its own login page. The realm's Google
            # identity provider and the skillbridge-web client are configured
            # in Keycloak; only the client secret is needed here.
            - name: KEYCLOAK_ISSUER
              value: https://auth.sentpul.click/realms/data-platform
            - name: KEYCLOAK_CLIENT_ID
              value: skillbridge-web
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sentiment-pulse-keycloak-oauth
                  key: KEYCLOAK_CLIENT_SECRET
            - name: KEYCLOAK_REDIRECT_URI
              value: https://wepower.sentpul.click/auth/oauth/keycloak/callback
            - name: KEYCLOAK_IDP_HINT
              value: google
            - name: OAUTH_FRONTEND_URL
              value: https://wepower.sentpul.click
          # connection.py raises if DATABASE_URL is unset rather than falling back
          # to localhost, so a bad env fails the probe instead of serving wrong data.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true

        # The AI sandbox's decision point, beside the app rather than shared.
        #
        # A SIDECAR AND NOT THE opa BINARY IN THE APP IMAGE: `opa eval` as a
        # subprocess measures 10ms, so latency was never the issue -- the
        # binary is 61MB static and spawning a process per request degrades
        # under concurrency in a way an HTTP call to a warm instance does not.
        #
        # Not in the Service, so nothing reaches it through a cluster address;
        # the app calls 127.0.0.1 because the two containers share the pod's
        # loopback. It binds the pod network (not loopback-only) for one
        # reason: the kubelet runs HTTP probes from the NODE's namespace, so a
        # probe with host=127.0.0.1 would check the node, and a loopback-bound
        # server is unprobeable. Readiness matters here -- serving model calls
        # with a dead policy is the failure this sidecar exists to prevent.
        - name: opa
          image: openpolicyagent/opa:1.22.0-static
          args:
            - "run"
            - "--server"
            - "--addr=:8181"
            - "--log-level=error"
            # THE FILE, NOT THE DIRECTORY. A ConfigMap mount is a tree of
            # atomic-writer symlinks (..data, ..2026_...); `opa run /policy`
            # walks all of them and finds the same package three times, which
            # is a startup crash ("multiple default rules"). Naming the mounted
            # file loads it once. A second .rego file needs its key added here.
            - "/policy/ai__sandbox.rego"
          ports:
            - name: opa
              containerPort: 8181
          volumeMounts:
            - name: ai-sandbox-policy
              mountPath: /policy
              readOnly: true
          readinessProbe:
            # No host: the kubelet probes the POD IP. A host of 127.0.0.1
            # probes the node and can never pass for a sidecar.
            httpGet: { path: /health, port: 8181 }
            initialDelaySeconds: 2
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        # Generated from backend/policy/**.rego by
        # backend/tools/render_policy_configmap.py -- never hand-edited, so the
        # deployed rules cannot differ from the ones `opa test` runs against.
        - name: ai-sandbox-policy
          configMap:
            name: ai-sandbox-policy
---
apiVersion: v1
kind: Service
metadata:
  name: sentiment-pulse-web
  namespace: webapp
spec:
  type: ClusterIP
  selector:
    app: sentiment-pulse-web
  ports:
    - port: 80
      targetPort: 8000
      name: http
