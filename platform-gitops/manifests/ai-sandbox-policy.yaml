# GENERATED by backend/tools/render_policy_configmap.py -- DO NOT EDIT.
#
# The AI sandbox policy, mounted by the OPA sidecar in
# sentiment-pulse-web.yaml. The source of truth is backend/policy/**.rego in
# the sentiment_pulse_web repository, which is what `opa test` runs against.
# Editing this file by hand makes the deployed rules differ from the tested
# ones, which is the one failure a policy must not have.

apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-sandbox-policy
  namespace: webapp
data:
  ai__sandbox.rego: |
    # The sandbox around every language-model call this application makes.
    #
    # WHY A POLICY AND NOT AN `if` IN PYTHON. The rules that keep a model from
    # reaching the evidence path are currently prose in docstrings and assertions
    # scattered across a use-case and its tests. That works until the second caller
    # appears -- and the MCP server will be the second caller, with AI agents on the
    # other side of it. A policy is one auditable statement of what a model may be
    # asked and what may be believed, evaluated the same way for every caller, and
    # changeable without redeploying the application.
    #
    # TWO GATES, because they fail differently:
    #   request   -- may this text be sent to a model at all?
    #   response  -- of what came back, what may be used?
    #
    # DENIALS CARRY REASONS. A boolean deny is unactionable; every rule here emits
    # a sentence, so a refusal can be shown to the person it affects and argued
    # with. That is the same standard the prerequisite table holds itself to.
    package ai.sandbox
    
    import rego.v1
    
    # Only these purposes exist. A model call with no declared purpose is a model
    # call nobody reviewed, and "we also use it for X" is how the evidence path
    # gets reached by accident.
    declared_purposes := {"cv_skill_extraction", "cover_letter_drafting", "cv_review"}
    
    # A letter may name ONLY skills the candidate confirmed, so the purposes that
    # tolerate a stray name and the purposes that do not have to be distinguishable
    # inside this policy. For extraction a name outside the vocabulary is dropped
    # and counted -- cheap, because the validator was always going to decide. For a
    # letter it is a FALSE CLAIM ABOUT A PERSON, sent to an employer under their
    # name, and there is no downstream check that makes it cheap.
    strict_purposes := {"cover_letter_drafting"}
    
    # A review's findings are counted, not named: `response` holds one entry per
    # finding -- the finding's AREA when its quote was verified against the CV, and
    # the literal "unquoted" when it was not. "unquoted" is deliberately absent
    # from the caller's allow-list (REVIEW_AREAS in cv_review.py), so it lands in
    # `rejected` and the majority rule below applies to it with no new rule: a
    # reply whose findings mostly quote text the CV does not contain is refused
    # whole, exactly as an extraction that ignored the vocabulary is.
    review_purposes := {"cv_review"}
    
    # A CV longer than this is a pasted document rather than a profile. Bounded
    # because cost and latency scale with it, and because the useful signal is in
    # the first few thousand characters.
    max_input_chars := 20000
    
    # A model returning more names than the vocabulary HAS is not answering the
    # question. 113 skills exist; anything near that from one CV is a failure mode
    # (echoing the allow-list back), not a polymath.
    max_response_names := 40
    
    # ---------------------------------------------------------------------------
    # Gate 1: the request
    # ---------------------------------------------------------------------------
    
    default request_allowed := false
    
    request_allowed if count(request_denials) == 0
    
    request_denials contains msg if {
    	not input.purpose in declared_purposes
    	msg := sprintf("purpose %q is not declared; allowed: %v", [input.purpose, declared_purposes])
    }
    
    request_denials contains msg if {
    	count(input.text) > max_input_chars
    	msg := sprintf("input is %d chars, over the %d limit", [count(input.text), max_input_chars])
    }
    
    request_denials contains "input is empty; there is nothing to extract" if {
    	count(trim_space(input.text)) == 0
    }
    
    # Constrained generation is the whole design: a model with no allow-list is
    # being asked to invent, which is the one thing it must never do here.
    #
    # A LETTER IS EXEMPT, and only at this gate. Its allow-list is the candidate's
    # CONFIRMED skills, which may legitimately be empty -- someone applying on
    # experience rather than a skill list still deserves a letter. The guarantee
    # does not weaken: with an empty allow-list every skill the draft names lands
    # in `rejected`, and the strict response rule below refuses ANY unconfirmed
    # name, so an empty list constrains the letter to naming nothing.
    request_denials contains "no allow-list supplied; unconstrained generation is not permitted" if {
    	not input.purpose in strict_purposes
    	count(input.allowed) == 0
    }
    
    # A review with more findings than this is a rewrite, and a wall of advice is
    # a wall nobody acts on. Mirrors MAX_FINDINGS in cv_review.py: the Python
    # constant bounds the PROMPT and this one bounds what may be BELIEVED, the same
    # split max_input_chars already has with MAX_CV_CHARS.
    max_review_findings := 8
    
    # A drafted letter longer than this is not a cover letter. Bounded on the
    # RESPONSE side as well as the request side, because the failure mode that
    # matters here is a model that keeps writing -- and the more it writes about a
    # person, the more of it nobody supplied.
    max_letter_chars := 4000
    
    # ---------------------------------------------------------------------------
    # Gate 2: the response
    # ---------------------------------------------------------------------------
    
    # Case-insensitive index of the vocabulary, so a model's casing does not cost
    # a real skill while still never widening what is permitted.
    _allowed_lower := {lower(a) | some a in input.allowed}
    
    # The subset the policy permits. This IS the enforcement: the caller uses this
    # set, not the model's reply.
    permitted contains name if {
    	some name in input.response
    	lower(name) in _allowed_lower
    }
    
    # Reported, never silently dropped. A model repeatedly proposing the same
    # absent name is evidence about the VOCABULARY, which is worth more than a
    # clean log.
    rejected contains name if {
    	some name in input.response
    	not lower(name) in _allowed_lower
    }
    
    default response_allowed := false
    
    response_allowed if count(response_denials) == 0
    
    response_denials contains msg if {
    	count(input.response) > max_response_names
    	msg := sprintf("model returned %d names, over the %d limit", [count(input.response), max_response_names])
    }
    
    # A reply that is mostly outside the vocabulary means the model ignored the
    # allow-list. Filtering would leave a plausible-looking remainder from a reply
    # that should not be trusted at all, so the whole thing is refused.
    #
    # A REVIEW IS EXCLUDED and has its own version below, because the arithmetic
    # here does not hold for it. `rejected` is a SET of names: five findings that
    # all failed their quote check collapse to the single name "unquoted", so
    # count(rejected) would be 1 against a response of 5 and this rule would never
    # fire for the case it exists to catch. A review's denominator is a count of
    # FINDINGS, which means counting the list.
    response_denials contains msg if {
    	not input.purpose in review_purposes
    	count(input.response) > 0
    	count(rejected) * 2 > count(input.response)
    	msg := sprintf("%d of %d names are outside the vocabulary; the allow-list was ignored", [count(rejected), count(input.response)])
    }
    
    # ---------------------------------------------------------------------------
    # Gate 2, for a review: findings must quote the document
    # ---------------------------------------------------------------------------
    #
    # WHAT `response` MEANS FOR A REVIEW. One entry per finding: the finding's area
    # when the caller verified its quote against the CV, and "unquoted" when it
    # could not. So this is the rule that enforces the condition ScoreCvQuality set
    # before any model was allowed near a CV -- "its findings would have to quote
    # the CV".
    
    # Counted over the LIST for the reason given above. A repeated area is also a
    # real repetition -- two `evidence` findings are two findings, not one vote.
    _unquoted_findings := count([x | some x in input.response; lower(x) == "unquoted"])
    
    response_denials contains msg if {
    	input.purpose in review_purposes
    	count(input.response) > 0
    	_unquoted_findings * 2 > count(input.response)
    	msg := sprintf("%d of %d findings quote text that is not in the CV; a review may only quote the document", [_unquoted_findings, count(input.response)])
    }
    
    response_denials contains msg if {
    	input.purpose in review_purposes
    	count(input.response) > max_review_findings
    	msg := sprintf("the review returned %d findings, over the %d limit", [count(input.response), max_review_findings])
    }
    
    # ---------------------------------------------------------------------------
    # Gate 2, stricter: a letter drafted about a person
    # ---------------------------------------------------------------------------
    #
    # WHAT `response` MEANS FOR A LETTER. The caller does not hand the policy the
    # prose and ask it to judge writing. It scans the draft for every name in the
    # vocabulary and passes THOSE -- the skill claims the letter makes -- as
    # `response`, with the candidate's CONFIRMED skills as `allowed`. So `rejected`
    # is exactly the set of skills the letter claims that the candidate never
    # confirmed, and the rule below is the one that matters in this whole file.
    
    # ONE unconfirmed skill refuses the WHOLE letter. Not the majority rule above:
    # a letter that claims AWS for someone who has never used it is not 20% wrong,
    # it is a lie with four true sentences around it, and keeping the true
    # sentences is how it reaches an employer.
    response_denials contains msg if {
    	input.purpose in strict_purposes
    	count(rejected) > 0
    	msg := sprintf("the draft claims %v, which the candidate did not confirm; a letter may only name confirmed skills", [rejected])
    }
    
    # The prose itself is passed as `text` on the response call, so its length is
    # checkable here rather than only in the client.
    response_denials contains msg if {
    	input.purpose in strict_purposes
    	count(input.text) > max_letter_chars
    	msg := sprintf("the draft is %d chars, over the %d limit for a letter", [count(input.text), max_letter_chars])
    }
    
    # A letter with no skill claims at all is not an error -- a candidate may be
    # applying on something other than a skill list -- but an EMPTY draft is.
    response_denials contains "the draft is empty; there is nothing to send" if {
    	input.purpose in strict_purposes
    	count(trim_space(input.text)) == 0
    }
    
    # The decision a caller consumes.
    decision := {
    	"request_allowed": request_allowed,
    	"request_denials": request_denials,
    	"response_allowed": response_allowed,
    	"response_denials": response_denials,
    	"permitted": permitted,
    	"rejected": rejected,
    }
