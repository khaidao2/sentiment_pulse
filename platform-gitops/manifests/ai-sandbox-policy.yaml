#
# The AI sandbox policy, mounted by the OPA sidecar in
# sentiment-pulse-web.yaml. The source of truth is backend/policy/**.rego in
# the sentiment_pulse_web repository, which is what `opa test` runs against.
# Editing this file by hand makes the deployed rules differ from the tested
# ones, which is the one failure a policy must not have.

apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-sandbox-policy
  namespace: webapp
data:
  ai__sandbox.rego: |
    # The sandbox around every language-model call this application makes.
    #
    # WHY A POLICY AND NOT AN `if` IN PYTHON. The rules that keep a model from
    # reaching the evidence path are currently prose in docstrings and assertions
    # scattered across a use-case and its tests. That works until the second caller
    # appears -- and the MCP server will be the second caller, with AI agents on the
    # other side of it. A policy is one auditable statement of what a model may be
    # asked and what may be believed, evaluated the same way for every caller, and
    # changeable without redeploying the application.
    #
    # TWO GATES, because they fail differently:
    #   request   -- may this text be sent to a model at all?
    #   response  -- of what came back, what may be used?
    #
    # DENIALS CARRY REASONS. A boolean deny is unactionable; every rule here emits
    # a sentence, so a refusal can be shown to the person it affects and argued
    # with. That is the same standard the prerequisite table holds itself to.
    package ai.sandbox
    
    import rego.v1
    
    # Only these purposes exist. A model call with no declared purpose is a model
    # call nobody reviewed, and "we also use it for X" is how the evidence path
    # gets reached by accident.
    declared_purposes := {"cv_skill_extraction"}
    
    # A CV longer than this is a pasted document rather than a profile. Bounded
    # because cost and latency scale with it, and because the useful signal is in
    # the first few thousand characters.
    max_input_chars := 20000
    
    # A model returning more names than the vocabulary HAS is not answering the
    # question. 113 skills exist; anything near that from one CV is a failure mode
    # (echoing the allow-list back), not a polymath.
    max_response_names := 40
    
    # ---------------------------------------------------------------------------
    # Gate 1: the request
    # ---------------------------------------------------------------------------
    
    default request_allowed := false
    
    request_allowed if count(request_denials) == 0
    
    request_denials contains msg if {
    	not input.purpose in declared_purposes
    	msg := sprintf("purpose %q is not declared; allowed: %v", [input.purpose, declared_purposes])
    }
    
    request_denials contains msg if {
    	count(input.text) > max_input_chars
    	msg := sprintf("input is %d chars, over the %d limit", [count(input.text), max_input_chars])
    }
    
    request_denials contains "input is empty; there is nothing to extract" if {
    	count(trim_space(input.text)) == 0
    }
    
    # Constrained generation is the whole design: a model with no allow-list is
    # being asked to invent, which is the one thing it must never do here.
    request_denials contains "no allow-list supplied; unconstrained generation is not permitted" if {
    	count(input.allowed) == 0
    }
    
    # ---------------------------------------------------------------------------
    # Gate 2: the response
    # ---------------------------------------------------------------------------
    
    # Case-insensitive index of the vocabulary, so a model's casing does not cost
    # a real skill while still never widening what is permitted.
    _allowed_lower := {lower(a) | some a in input.allowed}
    
    # The subset the policy permits. This IS the enforcement: the caller uses this
    # set, not the model's reply.
    permitted contains name if {
    	some name in input.response
    	lower(name) in _allowed_lower
    }
    
    # Reported, never silently dropped. A model repeatedly proposing the same
    # absent name is evidence about the VOCABULARY, which is worth more than a
    # clean log.
    rejected contains name if {
    	some name in input.response
    	not lower(name) in _allowed_lower
    }
    
    default response_allowed := false
    
    response_allowed if count(response_denials) == 0
    
    response_denials contains msg if {
    	count(input.response) > max_response_names
    	msg := sprintf("model returned %d names, over the %d limit", [count(input.response), max_response_names])
    }
    
    # A reply that is mostly outside the vocabulary means the model ignored the
    # allow-list. Filtering would leave a plausible-looking remainder from a reply
    # that should not be trusted at all, so the whole thing is refused.
    response_denials contains msg if {
    	count(input.response) > 0
    	count(rejected) * 2 > count(input.response)
    	msg := sprintf("%d of %d names are outside the vocabulary; the allow-list was ignored", [count(rejected), count(input.response)])
    }
    
    # The decision a caller consumes.
    decision := {
    	"request_allowed": request_allowed,
    	"request_denials": request_denials,
    	"response_allowed": response_allowed,
    	"response_denials": response_denials,
    	"permitted": permitted,
    	"rejected": rejected,
    }
