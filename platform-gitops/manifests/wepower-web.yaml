# WEPOWER HUB web app (Next.js) — repo github.com/khaidao2/wepowerhub-clone.
#
# Shares webapp-postgres with the Sentiment Pulse web app but owns the separate
# `wepower` schema; both projects have a `users` and a `companies`, so the two
# never share a table. Schema changes go through that repo's dbmate migrations
# (db/migrations), the same mechanism sentiment_pulse_web uses — never a
# hand-run ALTER, and never an automatic migration on pod start.
#
# Credentials are NOT here — they come from the SealedSecret in
# wepower-web-sealed-secrets.yaml, which the Application globs in alongside
# this file:
#   Secret wepower-web-secrets (ns webapp): DATABASE_URL, AUTH_SECRET,
#   EMAIL_WEBHOOK_SECRET
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wepower-web
  namespace: webapp
  labels:
    app: wepower-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wepower-web
  template:
    metadata:
      labels:
        app: wepower-web
    spec:
      # Ghim vào fedora-1 — chuyển khỏi khaibaai ngày 05/09/2026.
      #
      # Ghim, chứ không phải để trôi tự do, vì mạng giữa các node của cụm này
      # KHÔNG thông: một máy tự đăng ký ba lần dưới ba hostname (192.168.1.4,
      # 192.168.1.5, fedora), mỗi lần được cấp một dải pod riêng, nên bảng định
      # tuyến trên node chủ trỏ ba hướng vào cùng một máy. Pod web từng vô tình
      # nằm chung node với cloudflared suốt chín ngày và không ai để ý; lần
      # khởi động lại đầu tiên đẩy nó sang node khác là site chết với
      # `no route to host` trong khi pod vẫn khoẻ.
      #
      # Hệ quả bắt buộc: cloudflared và Postgres phải nằm CÙNG node với nó.
      # Cả hai được ghim theo trong cùng lần sửa này — chuyển mỗi web thì web
      # sống mà không ai gọi tới được, và nó không gọi được database.
      nodeSelector:
        kubernetes.io/hostname: fedora-1
      containers:
        - name: web
          # Built by .github/workflows/build-image.yml in the app repo.
          image: ghcr.io/khaidao2/wepowerhub-web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - secretRef:
                name: wepower-web-secrets
          env:
            # Public origin. Email tracking pixels and click links are built
            # from this, so it has to be what a recipient's mail client can
            # reach — not the in-cluster service name.
            - name: APP_URL
              value: https://wepower.sentpul.click
            - name: NODE_ENV
              value: production
          # /api/v1/ping is the unauthenticated liveness route: the app's auth
          # proxy excludes it deliberately, so probes need no credentials.
          readinessProbe:
            httpGet:
              path: /api/v1/ping
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/ping
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false   # Next writes its cache under .next
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: wepower-web
  namespace: webapp
spec:
  # NodePort, không phải ClusterIP, từ 05/09/2026.
  #
  # cloudflared vẫn ở node cũ và PHẢI ở đó: nó là cửa vào của cả airflow,
  # argocd, kafka, keycloak, grafana, minio — chuyển nó theo web là hạ toàn bộ
  # số đó, vì mạng giữa các node không thông. Nhưng cũng chính vì không thông,
  # nó không gọi được ClusterIP của một pod nằm ở fedora-1.
  #
  # NodePort đi vòng qua chỗ hỏng: lưu lượng ra khỏi pod cloudflared tới địa
  # chỉ IP của node fedora-1 là lưu lượng giữa hai MÁY, do node NAT, không đi
  # qua bảng định tuyến pod đang sai.
  type: NodePort
  selector:
    app: wepower-web
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30080
      name: http
