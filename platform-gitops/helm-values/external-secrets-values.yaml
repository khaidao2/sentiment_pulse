# External Secrets Operator reads Vault and writes ordinary Kubernetes Secrets.
#
# WHY THIS AND NOT THE VAULT AGENT INJECTOR. Every consumer on this platform
# already reads a plain Secret by name: the five sinks, the dbt task pods, the
# Airflow components through envFrom and secretKeyRef, the web app. ESO keeps
# that contract, so a credential moving from a SealedSecret to Vault changes
# nothing in any Deployment. It also fails softer. If Vault is sealed or down,
# the Secrets it already wrote keep working and only refresh stops, where the
# injector would block pod startup.

replicaCount: 1

# Explicit, because the Vault Kubernetes auth role is bound to this exact
# service account name and namespace. Leaving it to the chart's fullname
# template would make a rename silently break authentication, and the symptom
# would be a permission denied from Vault rather than anything naming this file.
serviceAccount:
  create: true
  name: external-secrets

# The CRDs ship with the chart. ArgoCD applies them in the same sync, which is
# why the ClusterSecretStore has its own Application in a later wave.
installCRDs: true

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: /metrics

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

webhook:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

certController:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
