# Keycloak Helm values for Local K3s
replicaCount: 1

proxy: edge

extraEnvVars:
  - name: KC_PROXY
    value: "edge"
  # Ép Keycloak sinh URL https (đứng sau Cloudflare/cloudflared cắt TLS ở edge,
  # nói http xuống service:80). Nếu thiếu sẽ bị ssl_required + redirect_uri http://.
  # LƯU Ý: không được set đồng thời KC_HOSTNAME và KC_HOSTNAME_URL (Keycloak 21 sẽ crash).
  - name: KC_HOSTNAME_URL
    value: "https://auth.sentpul.click"
  - name: KC_HOSTNAME_ADMIN_URL
    value: "https://auth.sentpul.click"
  - name: KC_HOSTNAME_STRICT
    value: "false"
  - name: KC_HOSTNAME_STRICT_HTTPS
    value: "false"

auth:
  adminUser: admin
  adminPassword: adminpassword

image:
  repository: bitnamilegacy/keycloak

# PostgreSQL DB Configuration
postgresql:
  image:
    repository: bitnamilegacy/postgresql
  enabled: true # Keycloak sử dụng DB của chính nó cho đơn giản, tự cô lập
  auth:
    database: bitnami_keycloak
    username: bn_keycloak
    password: DjDN3dzzvq
    postgresPassword: CsxYT9n2L9
  primary:
    persistence:
      enabled: true
      size: 1Gi
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "200m"
        memory: "512Mi"

resources:
  requests:
    cpu: "200m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "1024Mi"
