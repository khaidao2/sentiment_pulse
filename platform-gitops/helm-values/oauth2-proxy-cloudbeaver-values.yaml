# oauth2-proxy for CloudBeaver — gates cloudbeaver.sentpul.click behind Keycloak.
# Traffic path: cloudflared -> this oauth2-proxy -> cloudbeaver service.
config:
  # Credentials live in a SealedSecret; see
  # manifests/oauth2-proxy-cloudbeaver-sealed-secret.yaml.
  existingSecret: oauth2-proxy-cloudbeaver-sealed
  # Must match the secret of the `cloudbeaver` Keycloak client
  # (scripts/cloudbeaver_keycloak.sh). Move to Vault for production.
  # openssl rand -base64 32 | tr -- '+/' '-_'
  configFile: |-
    provider = "oidc"
    oidc_issuer_url = "https://auth.sentpul.click/realms/data-platform"
    redirect_url = "https://cloudbeaver.sentpul.click/oauth2/callback"
    upstreams = [
        "http://cloudbeaver.database.svc.cluster.local:8978"
    ]
    set_xauthrequest = true
    pass_user_headers = true
    cookie_secure = true
    # Keycloak users are created by admin without SMTP email verification,
    # so id_token has email_verified=false. Accept it (internal IdP).

resources:
  requests:
    cpu: "50m"
    memory: "64Mi"
  limits:
    cpu: "100m"
    memory: "128Mi"

ingress:
  enabled: false

# Access is restricted to an explicit allowlist, not a domain: both accounts
# share a provider, so a domain filter would admit the whole internet. The list
# lives in the in-cluster ConfigMap "oauth2-proxy-allowed-emails" (key restricted_user_access) and is
# deliberately NOT in git -- these are real personal addresses and this repo is
# public. Edit it with: kubectl -n <ns> edit configmap oauth2-proxy-allowed-emails
authenticatedEmailsFile:
  enabled: true
  persistence: configmap
  template: oauth2-proxy-allowed-emails
