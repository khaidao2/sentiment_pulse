# Reloader exists for one specific gap. Vault's database engine issues a new
# PostgreSQL credential per lease and ESO writes it into the Secret, but the web
# app and the Airflow components read their DSN from env at pod start. A
# refreshed Secret does not restart them, so without this a rotation would
# serve a credential the pods never read, and the symptom would be
# authentication failures at the next unrelated restart.
#
# It acts only on workloads that ask for it by annotation, so deploying it
# changes nothing until a Deployment carries
# secret.reloader.stakater.com/reload: <secret name>.

reloader:
  # Watches every namespace, because the credentials it has to react to live in
  # airflow, database and webapp.
  watchGlobally: true

  # Secrets AND ConfigMaps. The original reasoning here was that nothing needed
  # a restart on a ConfigMap change, and that was wrong. cloudflared reads its
  # tunnel config at startup, so adding a hostname updated the ConfigMap and
  # changed nothing until someone restarted the pod by hand. That produced a
  # real 404 on a brand new hostname on 2026-11-11.
  #
  # Watching ConfigMaps is still opt-in per workload by annotation, so this
  # changes nothing for any Deployment that does not ask for it. The fear behind
  # the original choice, a ConfigMap edit silently restarting the sinks, needs
  # those sinks to carry the annotation, and they do not.
  ignoreConfigMaps: false
  ignoreSecrets: false

  deployment:
    replicas: 1
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi
