# sealed-secrets controller values.
#
# This file exists to add scrape annotations. The controller decrypts every
# credential on this platform, and Prometheus held zero sealed_secrets_* metrics,
# so a controller that started failing to unseal would have looked identical to
# one with nothing to do. sealed_secrets_controller_unseal_errors_total is the
# number worth alerting on, and it was not being collected.
#
# fullnameOverride moved here from the Application's helm.parameters. It is load
# bearing: kubeseal defaults to looking for a controller named
# sealed-secrets-controller in kube-system, and every reseal script in
# scripts/ relies on that default.
#
# THE CHART VERSION IS NOT CHANGED BY THIS FILE. 2.16.1 is pinned because its
# appVersion 0.27.1 is the controller image already running, and the recorded
# decision for that pin explicitly rejected bundling a controller upgrade into
# an unrelated change.
fullnameOverride: sealed-secrets-controller

podAnnotations:
  # Port 8081 is the metrics port on the running container, named "metrics",
  # read off the live Deployment rather than assumed. 8080 is the API it serves
  # kubeseal on, which is not the metrics endpoint.
  prometheus.io/scrape: "true"
  prometheus.io/port: "8081"
  prometheus.io/path: /metrics
