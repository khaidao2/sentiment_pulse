# The admin password is NOT here -- it was, in plaintext, in a public repo.
admin:
  existingSecret: grafana-admin-sealed
  userKey: admin-user
  passwordKey: admin-password

# Supplies GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET and CH_DATASOURCE_PASSWORD.
# Grafana expands $VAR in provisioning files, which is how the datasource below
# gets its password without the value appearing in this file.
envFromSecrets:
  - name: grafana-oauth-sealed
  - name: grafana-clickhouse-ds-sealed

persistence:
  enabled: true
  size: 1Gi
  storageClassName: local-path

plugins:
  - grafana-clickhouse-datasource

ingress:
  enabled: true
  ingressClassName: traefik
  hosts:
    - grafana.sentpul.click
  path: /

env:
  GF_SERVER_DOMAIN: "grafana.sentpul.click"
  GF_SERVER_ROOT_URL: "https://grafana.sentpul.click"
  GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
  GF_AUTH_GENERIC_OAUTH_NAME: "Keycloak"
  GF_AUTH_GENERIC_OAUTH_CLIENT_ID: "grafana"
  GF_AUTH_GENERIC_OAUTH_SCOPES: "openid email profile"
  GF_AUTH_GENERIC_OAUTH_AUTH_URL: "https://auth.sentpul.click/realms/data-platform/protocol/openid-connect/auth"
  GF_AUTH_GENERIC_OAUTH_TOKEN_URL: "https://auth.sentpul.click/realms/data-platform/protocol/openid-connect/token"
  GF_AUTH_GENERIC_OAUTH_API_URL: "https://auth.sentpul.click/realms/data-platform/protocol/openid-connect/userinfo"
  GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
  GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
  GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(realm_access.roles[*], 'airflow_admin') && 'Admin' || 'Viewer'"

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      access: proxy
      url: http://prometheus-server.monitoring.svc.cluster.local:80
      isDefault: true
    - name: ClickHouse
      type: grafana-clickhouse-datasource
      access: proxy
      isDefault: false
      jsonData:
        server: clickhouse.database.svc.cluster.local
        port: 8123
        protocol: http
        username: clickhouse
        defaultDatabase: default
        tlsSkipVerify: false
      secureJsonData:
        password: $CH_DATASOURCE_PASSWORD

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
    - name: 'default'
      orgId: 1
      folder: ''
      type: file
      disableDeletion: false
      editable: true
      options:
        path: /var/lib/grafana/dashboards/default

dashboards:
  default:
    node-exporter:
      gnetId: 1860
      revision: 37
      datasource: Prometheus
    kubernetes-pods:
      gnetId: 15661
      revision: 1
      datasource: Prometheus

    # The credential plane: Vault, External Secrets, and the scrape health that
    # says whether this page can be trusted at all.
    #
    # Every panel query was run against this Prometheus before it was committed
    # and all eleven returned series. A panel pointing at a metric that does not
    # exist renders "No data", which looks like an outage rather than a mistake,
    # so the metric names here are measured and not assumed.
    #
    # Inline rather than gnetId because there is no community dashboard for this
    # platform's own credential plane, and inline rather than a sidecar
    # ConfigMap because this chart is configured with the file provider and
    # adding the sidecar would be a second way to do one thing.
    secrets-platform:
      json: |-
        {
          "schemaVersion": 39,
          "title": "Secrets and credential plane",
          "uid": "secrets-plane",
          "tags": [
            "secrets",
            "vault",
            "eso"
          ],
          "timezone": "browser",
          "editable": true,
          "refresh": "30s",
          "time": {
            "from": "now-6h",
            "to": "now"
          },
          "timepicker": {},
          "templating": {
            "list": []
          },
          "annotations": {
            "list": []
          },
          "panels": [
            {
              "type": "row",
              "title": "Vault",
              "gridPos": {
                "x": 0,
                "y": 0,
                "w": 24,
                "h": 1
              },
              "id": 100
            },
            {
              "id": 1,
              "title": "Seal status",
              "type": "stat",
              "datasource": "Prometheus",
              "gridPos": {
                "x": 0,
                "y": 1,
                "w": 6,
                "h": 4
              },
              "description": "Indicates whether the Vault storage barrier is unsealed and operational, allowing read and write operations.",
              "targets": [
                {
                  "datasource": "Prometheus",
                  "expr": "vault_core_unsealed",
                  "refId": "A"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "mappings": [
                    {
                      "type": "value",
                      "options": {
                        "0": {
                          "text": "SEALED",
                          "color": "red",
                          "index": 1
                        },
                        "1": {
                          "text": "Unsealed",
                          "color": "green",
                          "index": 0
                        }
                      }
                    }
                  ],
                  "color": {
                    "mode": "thresholds"
                  },
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {
                        "color": "red",
                        "value": null
                      },
                      {
                        "color": "green",
                        "value": 1
                      }
                    ]
                  }
                },
                "overrides": []
              },
              "options": {
                "reduceOptions": {
                  "values": false,
                  "calcs": [
                    "lastNotNull"
                  ],
                  "fields": ""
                },
                "orientation": "auto",
                "textMode": "auto",
                "wideDisplay": true
              }
            },
            {
              "id": 2,
              "title": "Live leases",
              "type": "stat",
              "datasource": "Prometheus",
              "gridPos": {
                "x": 6,
                "y": 1,
                "w": 6,
                "h": 4
              },
              "description": "A lease count of zero means no dynamic credentials have been issued yet, so it is expected until the database secrets engine is in use.",
              "targets": [
                {
                  "datasource": "Prometheus",
                  "expr": "vault_expire_num_leases",
                  "refId": "A"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "mappings": [],
                  "color": {
                    "mode": "palette-classic"
                  },
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {
                        "color": "green",
                        "value": null
                      }
                    ]
                  }
                },
                "overrides": []
              },
              "options": {
                "reduceOptions": {
                  "values": false,
                  "calcs": [
                    "lastNotNull"
                  ],
                  "fields": ""
                },
                "orientation": "auto",
                "textMode": "auto"
              }
            },
            {
              "id": 3,
              "title": "Active node",
              "type": "stat",
              "datasource": "Prometheus",
              "gridPos": {
                "x": 12,
                "y": 1,
                "w": 6,
                "h": 4
              },
              "description": "Shows whether this Vault cluster node is currently the active leader handling write and coordination requests.",
              "targets": [
                {
                  "datasource": "Prometheus",
                  "expr": "vault_core_active",
                  "refId": "A"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "mappings": [
                    {
                      "type": "value",
                      "options": {
                        "0": {
                          "text": "Standby",
                          "color": "blue",
                          "index": 1
                        },
                        "1": {
                          "text": "Active",
                          "color": "green",
                          "index": 0
                        }
                      }
                    }
                  ],
                  "color": {
                    "mode": "thresholds"
                  },
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {
                        "color": "blue",
                        "value": null
                      },
                      {
                        "color": "green",
                        "value": 1
                      }
                    ]
                  }
                },
                "overrides": []
              },
              "options": {
                "reduceOptions": {
                  "values": false,
                  "calcs": [
                    "lastNotNull"
                  ],
                  "fields": ""
                },
                "orientation": "auto",
                "textMode": "auto"
              }
            },
            {
              "id": 7,
              "title": "Mounted engines",
              "type": "stat",
              "datasource": "Prometheus",
              "gridPos": {
                "x": 18,
                "y": 1,
                "w": 6,
                "h": 4
              },
              "description": "Total number of secret engines and auth methods mounted across Vault instances.",
              "targets": [
                {
                  "datasource": "Prometheus",
                  "expr": "vault_core_mount_table_num_entries",
                  "refId": "A"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "mappings": [],
                  "color": {
                    "mode": "palette-classic"
                  },
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {
                        "color": "green",
                        "value": null
                      }
                    ]
                  }
                },
                "overrides": []
              },
              "options": {
                "reduceOptions": {
                  "values": false,
                  "calcs": [
                    "lastNotNull"
                  ],
                  "fields": ""
                },
                "orientation": "auto",
                "textMode": "auto"
              }
            },
            {
              "id": 4,
              "title": "In flight requests",
              "type": "timeseries",
              "datasource": "Prometheus",
              "gridPos": {
                "x": 0,
                "y": 5,
                "w": 8,
                "h": 6
              },
              "description": "Number of concurrent HTTP requests currently being processed by Vault endpoints.",
              "targets": [
                {
                  "datasource": "Prometheus",
                  "expr": "vault_core_in_flight_requests",
                  "refId": "A"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "custom": {
                    "drawStyle": "line",
                    "lineInterpolation": "linear",
                    "barAlignment": 0,
                    "lineWidth": 1,
                    "fillOpacity": 10
                  },
                  "color": {
                    "mode": "palette-classic"
                  }
                },
                "overrides": []
              },
              "options": {
                "tooltip": {
                  "mode": "single",
                  "sort": "none"
                },
                "legend": {
                  "displayMode": "list",
                  "placement": "bottom",
                  "calcs": []
                }
              }
            },
            {
              "id": 5,
              "title": "Heap bytes",
              "type": "timeseries",
              "datasource": "Prometheus",
              "gridPos": {
                "x": 8,
                "y": 5,
                "w": 8,
                "h": 6
              },
              "description": "Heap memory allocated by the Vault process runtime over time.",
              "targets": [
                {
                  "datasource": "Prometheus",
                  "expr": "vault_runtime_alloc_bytes",
                  "refId": "A"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "custom": {
                    "drawStyle": "line",
                    "lineInterpolation": "linear",
                    "lineWidth": 1,
                    "fillOpacity": 10
                  },
                  "unit": "bytes",
                  "color": {
                    "mode": "palette-classic"
                  }
                },
                "overrides": []
              },
              "options": {
                "tooltip": {
                  "mode": "single",
                  "sort": "none"
                },
                "legend": {
                  "displayMode": "list",
                  "placement": "bottom",
                  "calcs": []
                }
              }
            },
            {
              "id": 6,
              "title": "Barrier reads per second",
              "type": "timeseries",
              "datasource": "Prometheus",
              "gridPos": {
                "x": 16,
                "y": 5,
                "w": 8,
                "h": 6
              },
              "description": "Storage barrier read throughput servicing internal Vault queries and leases.",
              "targets": [
                {
                  "datasource": "Prometheus",
                  "expr": "rate(vault_barrier_get_count[5m])",
                  "refId": "A"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "custom": {
                    "drawStyle": "line",
                    "lineInterpolation": "linear",
                    "lineWidth": 1,
                    "fillOpacity": 10
                  },
                  "color": {
                    "mode": "palette-classic"
                  }
                },
                "overrides": []
              },
              "options": {
                "tooltip": {
                  "mode": "single",
                  "sort": "none"
                },
                "legend": {
                  "displayMode": "list",
                  "placement": "bottom",
                  "calcs": []
                }
              }
            },
            {
              "type": "row",
              "title": "External Secrets",
              "gridPos": {
                "x": 0,
                "y": 11,
                "w": 24,
                "h": 1
              },
              "id": 101
            },
            {
              "id": 8,
              "title": "Store readiness",
              "type": "table",
              "datasource": "Prometheus",
              "gridPos": {
                "x": 0,
                "y": 12,
                "w": 8,
                "h": 6
              },
              "description": "Reflects whether External Secrets Operator successfully validates connection, authentication, and readiness for the cluster secret store.",
              "targets": [
                {
                  "datasource": "Prometheus",
                  "expr": "clustersecretstore_status_condition{condition=\"Ready\"}",
                  "refId": "A"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "color": {
                    "mode": "palette-classic"
                  },
                  "mappings": []
                },
                "overrides": []
              },
              "options": {
                "showHeader": true,
                "sortBy": []
              }
            },
            {
              "id": 9,
              "title": "Provider API calls per second",
              "type": "timeseries",
              "datasource": "Prometheus",
              "gridPos": {
                "x": 8,
                "y": 12,
                "w": 8,
                "h": 6
              },
              "description": "Rate of API requests made to external secret providers, categorized by response status to expose failures alongside successes.",
              "targets": [
                {
                  "datasource": "Prometheus",
                  "expr": "rate(externalsecret_provider_api_calls_count[5m])",
                  "legendFormat": "{{status}} ({{provider}} - {{call}})",
                  "refId": "A"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "custom": {
                    "drawStyle": "line",
                    "lineInterpolation": "linear",
                    "lineWidth": 1,
                    "fillOpacity": 10
                  },
                  "color": {
                    "mode": "palette-classic"
                  }
                },
                "overrides": []
              },
              "options": {
                "tooltip": {
                  "mode": "multi",
                  "sort": "none"
                },
                "legend": {
                  "displayMode": "table",
                  "placement": "bottom",
                  "calcs": [
                    "lastNotNull"
                  ]
                }
              }
            },
            {
              "id": 10,
              "title": "Reconcile duration",
              "type": "timeseries",
              "datasource": "Prometheus",
              "gridPos": {
                "x": 16,
                "y": 12,
                "w": 8,
                "h": 6
              },
              "description": "Duration distribution of cluster secret store reconciliation cycles.",
              "targets": [
                {
                  "datasource": "Prometheus",
                  "expr": "clustersecretstore_reconcile_duration",
                  "refId": "A"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "custom": {
                    "drawStyle": "line",
                    "lineInterpolation": "linear",
                    "lineWidth": 1,
                    "fillOpacity": 10
                  },
                  "unit": "s",
                  "color": {
                    "mode": "palette-classic"
                  }
                },
                "overrides": []
              },
              "options": {
                "tooltip": {
                  "mode": "single",
                  "sort": "none"
                },
                "legend": {
                  "displayMode": "list",
                  "placement": "bottom",
                  "calcs": []
                }
              }
            },
            {
              "type": "row",
              "title": "Scrape health",
              "gridPos": {
                "x": 0,
                "y": 18,
                "w": 24,
                "h": 1
              },
              "id": 102
            },
            {
              "id": 11,
              "title": "Targets up",
              "type": "table",
              "datasource": "Prometheus",
              "gridPos": {
                "x": 0,
                "y": 19,
                "w": 24,
                "h": 6
              },
              "description": "Scrape availability for every target Prometheus knows about, including Vault, External Secrets, the sealed-secrets controller and Reloader. A value of 0 means that component is down or unreachable, and its panels above will show stale or missing data until it recovers.",
              "targets": [
                {
                  "datasource": "Prometheus",
                  "expr": "up",
                  "instant": true,
                  "range": false,
                  "refId": "A"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "color": {
                    "mode": "palette-classic"
                  },
                  "mappings": []
                },
                "overrides": []
              },
              "options": {
                "showHeader": true,
                "sortBy": []
              }
            },
            {
              "type": "row",
              "title": "Sealed Secrets and Reloader",
              "gridPos": {
                "x": 0,
                "y": 26,
                "w": 24,
                "h": 1
              },
              "id": 103
            },
            {
              "id": 12,
              "title": "Sealed Secrets controller",
              "type": "stat",
              "datasource": "Prometheus",
              "gridPos": {
                "x": 0,
                "y": 27,
                "w": 6,
                "h": 4
              },
              "description": "Shows the running Sealed Secrets controller version. If it disappears, no new SealedSecret can be decrypted into a Secret, so credentials being created or rotated through git stop landing in the cluster until the controller is back. Existing Secrets keep working.",
              "targets": [
                {
                  "datasource": "Prometheus",
                  "expr": "count by (revision) (sealed_secrets_controller_build_info)",
                  "refId": "A",
                  "legendFormat": "{{revision}}"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "mappings": [],
                  "color": {
                    "mode": "palette-classic"
                  },
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {
                        "color": "red",
                        "value": null
                      },
                      {
                        "color": "green",
                        "value": 1
                      }
                    ]
                  }
                },
                "overrides": []
              },
              "options": {
                "reduceOptions": {
                  "values": false,
                  "calcs": [
                    "lastNotNull"
                  ],
                  "fields": ""
                },
                "orientation": "auto",
                "textMode": "auto"
              }
            },
            {
              "id": 13,
              "title": "SealedSecrets synced",
              "type": "stat",
              "datasource": "Prometheus",
              "gridPos": {
                "x": 6,
                "y": 27,
                "w": 6,
                "h": 4
              },
              "description": "Number of SealedSecrets the controller has decrypted and applied successfully. A drop means a credential is no longer being kept in sync with git; compare with the next panel to see whether it is a failure or a deletion.",
              "targets": [
                {
                  "datasource": "Prometheus",
                  "expr": "count(sealed_secrets_controller_condition_info{condition=\"Synced\"} == 1)",
                  "refId": "A"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "mappings": [],
                  "color": {
                    "mode": "palette-classic"
                  },
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {
                        "color": "green",
                        "value": null
                      }
                    ]
                  }
                },
                "overrides": []
              },
              "options": {
                "reduceOptions": {
                  "values": false,
                  "calcs": [
                    "lastNotNull"
                  ],
                  "fields": ""
                },
                "orientation": "auto",
                "textMode": "auto"
              }
            },
            {
              "id": 14,
              "title": "SealedSecrets not synced",
              "type": "stat",
              "datasource": "Prometheus",
              "gridPos": {
                "x": 12,
                "y": 27,
                "w": 6,
                "h": 4
              },
              "description": "Number of SealedSecrets whose last unseal failed, so the Secret they should produce is missing or stale. Anything above zero needs attention, usually a sealing key mismatch or a wrong namespace or name. Shows 0 when none are failing.",
              "targets": [
                {
                  "datasource": "Prometheus",
                  "expr": "count(sealed_secrets_controller_condition_info{condition=\"Synced\"} == 0) or vector(0)",
                  "refId": "A"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "mappings": [],
                  "color": {
                    "mode": "palette-classic"
                  },
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {
                        "color": "green",
                        "value": null
                      },
                      {
                        "color": "red",
                        "value": 1
                      }
                    ]
                  }
                },
                "overrides": []
              },
              "options": {
                "reduceOptions": {
                  "values": false,
                  "calcs": [
                    "lastNotNull"
                  ],
                  "fields": ""
                },
                "orientation": "auto",
                "textMode": "auto"
              }
            },
            {
              "id": 15,
              "title": "Unseal failures (1h)",
              "type": "stat",
              "datasource": "Prometheus",
              "gridPos": {
                "x": 18,
                "y": 27,
                "w": 6,
                "h": 4
              },
              "description": "Failed decryption attempts in the last hour. The controller only exposes the unseal errors counter after its first failure, so until then the series is absent and this query falls back to 0 instead of showing No data. Any value above zero means a SealedSecret could not be decrypted.",
              "targets": [
                {
                  "datasource": "Prometheus",
                  "expr": "sum(increase(sealed_secrets_controller_unseal_errors_total[1h])) or vector(0)",
                  "refId": "A"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "mappings": [],
                  "color": {
                    "mode": "palette-classic"
                  },
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {
                        "color": "green",
                        "value": null
                      },
                      {
                        "color": "red",
                        "value": 1
                      }
                    ]
                  }
                },
                "overrides": []
              },
              "options": {
                "reduceOptions": {
                  "values": false,
                  "calcs": [
                    "lastNotNull"
                  ],
                  "fields": ""
                },
                "orientation": "auto",
                "textMode": "auto"
              }
            },
            {
              "id": 16,
              "title": "Unseal requests per second",
              "type": "timeseries",
              "datasource": "Prometheus",
              "gridPos": {
                "x": 0,
                "y": 31,
                "w": 8,
                "h": 6
              },
              "description": "How often the controller attempts to decrypt SealedSecrets. Bursts follow commits that add or change sealed credentials or a controller restart; a sustained high rate on a quiet repo suggests a reconcile loop.",
              "targets": [
                {
                  "datasource": "Prometheus",
                  "expr": "sum(rate(sealed_secrets_controller_unseal_requests_total[5m]))",
                  "refId": "A",
                  "legendFormat": "unseal requests"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "custom": {
                    "drawStyle": "line",
                    "lineInterpolation": "linear",
                    "barAlignment": 0,
                    "lineWidth": 1,
                    "fillOpacity": 10
                  },
                  "color": {
                    "mode": "palette-classic"
                  }
                },
                "overrides": []
              },
              "options": {
                "tooltip": {
                  "mode": "single",
                  "sort": "none"
                },
                "legend": {
                  "displayMode": "list",
                  "placement": "bottom",
                  "calcs": []
                }
              }
            },
            {
              "id": 17,
              "title": "Reloader events received and processed",
              "type": "timeseries",
              "datasource": "Prometheus",
              "gridPos": {
                "x": 8,
                "y": 31,
                "w": 8,
                "h": 6
              },
              "description": "Rate of Secret and ConfigMap changes Reloader sees against the rate it finishes handling. Received staying above processed for long means changes to credentials are queuing and workloads may keep using stale values.",
