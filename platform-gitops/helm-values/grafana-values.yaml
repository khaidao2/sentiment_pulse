adminPassword: adminpassword

ingress:
  enabled: true
  ingressClassName: traefik
  hosts:
    - grafana.sentpul.click
  path: /

env:
  GF_SERVER_DOMAIN: "grafana.sentpul.click"
  GF_SERVER_ROOT_URL: "https://grafana.sentpul.click"
  GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
  GF_AUTH_GENERIC_OAUTH_NAME: "Keycloak"
  GF_AUTH_GENERIC_OAUTH_CLIENT_ID: "grafana"
  GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: "XP2t3V0jEDoVv8HGek6FbDkEOeQe7E7I"
  GF_AUTH_GENERIC_OAUTH_SCOPES: "openid email profile"
  GF_AUTH_GENERIC_OAUTH_AUTH_URL: "https://auth.sentpul.click/realms/data-platform/protocol/openid-connect/auth"
  GF_AUTH_GENERIC_OAUTH_TOKEN_URL: "https://auth.sentpul.click/realms/data-platform/protocol/openid-connect/token"
  GF_AUTH_GENERIC_OAUTH_API_URL: "https://auth.sentpul.click/realms/data-platform/protocol/openid-connect/userinfo"
  GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
  GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(roles[*], 'airflow_admin') && 'Admin' || 'Viewer'"
