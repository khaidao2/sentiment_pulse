# oauth2-proxy values.yaml
config:
  # Credentials live in a SealedSecret, not here. This file was public
  # with real values in it; see manifests/oauth2-proxy-airflow-sealed-secret.yaml.
  # Chart 7.7.2 reads client-id / client-secret / cookie-secret from it.
  existingSecret: oauth2-proxy-airflow-sealed
  configFile: |-
    provider = "oidc"
    oidc_issuer_url = "https://auth.sentpul.click/realms/data-platform"
    redirect_url = "https://airflow.sentpul.click/oauth2/callback"
    upstreams = [
        "http://airflow-api-server.airflow.svc.cluster.local:8080"
    ]
    set_xauthrequest = true
    pass_user_headers = true
    cookie_secure = true

resources:
  requests:
    cpu: "50m"
    memory: "64Mi"
  limits:
    cpu: "100m"
    memory: "128Mi"

ingress:
  enabled: false
  className: traefik
  path: /
  hosts:
    - airflow.sentpul.click

# Access is restricted to an explicit allowlist, not a domain: both accounts
# share a provider, so a domain filter would admit the whole internet. The list
# lives in the in-cluster ConfigMap "oauth2-proxy-allowed-emails" (key restricted_user_access) and is
# deliberately NOT in git -- these are real personal addresses and this repo is
# public. Edit it with: kubectl -n <ns> edit configmap oauth2-proxy-allowed-emails
authenticatedEmailsFile:
  enabled: true
  persistence: configmap
  template: oauth2-proxy-allowed-emails
