# oauth2-proxy values.yaml
config:
  # Credentials live in a SealedSecret, not here. This file was public
  # with real values in it; see manifests/oauth2-proxy-airflow-sealed-secret.yaml.
  # Chart 7.7.2 reads client-id / client-secret / cookie-secret from it.
  existingSecret: oauth2-proxy-airflow-sealed
  configFile: |-
    provider = "oidc"
    oidc_issuer_url = "https://auth.sentpul.click/realms/data-platform"
    redirect_url = "https://airflow.sentpul.click/oauth2/callback"
    upstreams = [
        "http://airflow-api-server.airflow.svc.cluster.local:8080"
    ]
    email_domains = ["*"]
    set_xauthrequest = true
    pass_user_headers = true
    cookie_secure = false # Tắt HTTPS requirement cho local dev

resources:
  requests:
    cpu: "50m"
    memory: "64Mi"
  limits:
    cpu: "100m"
    memory: "128Mi"

ingress:
  enabled: false
  className: traefik
  path: /
  hosts:
    - airflow.sentpul.click
