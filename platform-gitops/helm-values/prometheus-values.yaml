# Prometheus Helm values for Local K3s (sentiment_pulse)
server:
  resources:
    limits:
      cpu: 500m
      memory: 1024Mi
    requests:
      cpu: 200m
      memory: 512Mi
  persistentVolume:
    size: 5Gi

alertmanager:
  enabled: false

pushgateway:
  enabled: false

# Cấu hình sub-chart kube-state-metrics
kube-state-metrics:
  enabled: true
  livenessProbe:
    enabled: false # Tắt tạm thời để gỡ lỗi liveness
  readinessProbe:
    enabled: false # Tắt tạm thời để gỡ lỗi readiness

# Cấu hình sub-chart prometheus-node-exporter
prometheus-node-exporter:
  enabled: true
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 10 # Gỡ lỗi nghẽn cập nhật khi có node offline
  extraArgs:
    - --web.listen-address=0.0.0.0:9101
  service:
    port: 9101
    targetPort: 9101
  livenessProbe:
    httpGet:
      host: 127.0.0.1
      port: 9101
  readinessProbe:
    httpGet:
      host: 127.0.0.1
      port: 9101
