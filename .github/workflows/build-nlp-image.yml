name: Build NLP image

# Build the NLP service image (FastAPI sentiment server + streaming worker)
# and push to ghcr.io. Runs only when the relevant code changes (torch/transformers
# install is slow).
on:
  push:
    branches: [main]
    paths:
      - 'nlp_pipeline/**'
      - 'api_crawler/sentiment_scores/**'
      - '.github/workflows/build-nlp-image.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: nlp_pipeline/Dockerfile
          push: true
          tags: |
            ghcr.io/khaidao2/sentiment-pulse-nlp:latest
            ghcr.io/khaidao2/sentiment-pulse-nlp:${{ github.sha }}
