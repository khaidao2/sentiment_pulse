name: build-reverse-etl-image

# Builds the reverse-ETL runner image (ClickHouse -> Postgres upsert) and pushes
# it to GHCR on every push to main that touches reverse_etl/. The reverse_etl
# Airflow DAG runs this image.

on:
  push:
    branches: [main]
    paths:
      - "reverse_etl/**"
      - ".github/workflows/build-reverse-etl-image.yml"
  workflow_dispatch: {}

concurrency:
  group: build-reverse-etl-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: tags
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./reverse_etl
          file: ./reverse_etl/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/khaidao2/sentiment-pulse-reverse-etl:latest
            ghcr.io/khaidao2/sentiment-pulse-reverse-etl:sha-${{ steps.tags.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
