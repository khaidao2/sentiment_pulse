name: build-image

# Builds the crawler/sink image and pushes it to GHCR on every push to main.
# The image is the single artifact both entrypoints run from:
#   - python -m api_crawler.jobs.itviec   (producer, via the Airflow DAG)
#   - python -m api_crawler.sink           (sink, via the k8s Deployment)
# Both DAG and Deployment reference ghcr.io/khaidao2/sentiment-pulse-crawler:latest.

on:
  push:
    branches: [main]
    # Only rebuild when something that lands in the image changes.
    paths:
      - "api_crawler/**"
      - "data-contracts/schemas/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/build-image.yml"
  workflow_dispatch: {}

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # write back the pinned image tag to the sink manifest
      packages: write        # push to GHCR with the built-in GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: tags
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .            # build from repo root (needs api_crawler/ + schemas/)
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/khaidao2/sentiment-pulse-crawler:latest
            ghcr.io/khaidao2/sentiment-pulse-crawler:sha-${{ steps.tags.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Pin the sink Deployment to the immutable sha- tag so ArgoCD sees the
      # manifest change and rolls out the new image automatically. The DAG stays
      # on :latest (a fresh pod pulls it each run, so no pin needed there).
      # NOTE: this edits a sent-gen-generated file; re-running `sent-gen render`
      # resets it to :latest, and the next image build re-pins it — it converges.
      - name: Pin sink image to this SHA (ArgoCD auto-rollout)
        run: |
          FILE=platform-gitops/manifests/itviec_sink.yaml
          sed -i -E "s|(ghcr\.io/khaidao2/sentiment-pulse-crawler):[A-Za-z0-9._-]+|\1:sha-${{ steps.tags.outputs.sha }}|g" "$FILE"
          if git diff --quiet -- "$FILE"; then
            echo "sink image already current"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "chore(cd): pin itviec-sink to sha-${{ steps.tags.outputs.sha }} [skip ci]"
          git push
