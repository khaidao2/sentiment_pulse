name: Build crawler image

# Build the vn_stock crawler/sink image and push to ghcr.io. Runs only when the
# code or image definition changes (vnstock/pandas install is slow).
on:
  push:
    branches: [main]
    paths:
      - 'api_crawler/**'
      - 'Dockerfile'
      - '.github/workflows/build-image.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/khaidao2/sentiment-pulse-crawler:latest
            ghcr.io/khaidao2/sentiment-pulse-crawler:${{ github.sha }}
