name: build-dbt-image

# Builds the dbt runner image and pushes it to GHCR on every push to main that
# touches the dbt project. The Airflow DAG (and one-off test pods) run this image
# to execute `dbt build` against ClickHouse.

on:
  push:
    branches: [main]
    paths:
      - "dbt/**"
      - ".github/workflows/build-dbt-image.yml"
  workflow_dispatch: {}

concurrency:
  group: build-dbt-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write        # push to GHCR with the built-in GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: tags
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./dbt
          file: ./dbt/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/khaidao2/sentiment-pulse-dbt:latest
            ghcr.io/khaidao2/sentiment-pulse-dbt:sha-${{ steps.tags.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
